<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>신장고통합과학연구소 접속 QR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --mint:#3fae95; --mint2:#2c8a75; --bg:#fbfaf7; --txt:#2b2b2b; --dim:#7a7a72; --line:#e7e2d6; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'Pretendard','Malgun Gothic',sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .poster{max-width:520px;width:100%;background:#fff;border:2px solid var(--line);border-radius:22px;
    padding:36px 32px;text-align:center;box-shadow:0 8px 30px rgba(90,70,50,.08)}
  .eng{font-size:12px;letter-spacing:.14em;color:var(--dim);font-weight:700}
  h1{font-size:24px;margin:6px 0 2px}
  .sub{font-size:13.5px;color:var(--dim);margin-bottom:22px}
  .qrbox{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:inline-block}
  .qrbox img{width:260px;height:260px;display:block}
  .linktext{margin-top:18px;font-size:12.5px;color:var(--mint2);font-weight:700;word-break:break-all}
  .howto{margin-top:22px;text-align:left;background:#eef7f4;border:1.5px solid #bce3d8;border-radius:14px;
    padding:14px 18px;font-size:13px;line-height:1.8}
  .howto b{color:var(--mint2)}
  .footer{margin-top:20px;font-size:11.5px;color:var(--dim)}
  @media print{ body{padding:0} .poster{box-shadow:none;border:none} }
</style>
</head>
<body>
<div class="poster">
  <div class="eng">SHINJANG HIGH SCHOOL</div>
  <h1>🔬 신장고통합과학연구소</h1>
  <div class="sub">통합과학2 수행평가 게임 · 접속 안내</div>

  <div class="qrbox">
    <img src="assets/qr_shinjang_science.png" alt="접속 QR 코드">
  </div>

  <div class="linktext">https://bsh3408.github.io/tonghapgwahak-yeonguso/shinjang_science.html</div>

  <div class="howto">
    <b>1.</b> 휴대폰 카메라로 위 QR 코드를 비추면 바로 접속돼요.<br>
    <b>2.</b> 아이디는 <b>이름</b>, 처음 비밀번호는 <b>학번</b>이에요.<br>
    <b>3.</b> 이용 가능 시간: <b>평일 오전 8시 ~ 오후 5시</b> (공휴일 제외)
  </div>

  <div class="footer">신장고등학교 통합과학2</div>
</div>
</body>
</html>
