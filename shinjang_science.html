<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>신장고 통합과학연구소 · 역무실</title>
<style>
:root{--bg:#15171b;--panel:#22252c;--panel2:#2b2f38;--ink:#ece6d6;--sub:#a59f90;--acc:#e0b04a;--good:#6ad07a;--bad:#e0604a;--line:#3a3f4a;--blue:#5ab0e0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171b}}
:root[data-theme="dark"]{--bg:#15171b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.hide{display:none!important}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px}
/* 로그인 */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 30%,#2a3040,#15171b 70%)}
.logincard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;width:100%;max-width:380px;text-align:center}
.logincard .en{font-size:12px;letter-spacing:.2em;color:var(--sub)}
.logincard h1{margin:6px 0 2px;font-size:24px}.logincard h1 span{color:var(--acc)}
.logincard p{color:var(--sub);font-size:13.5px;line-height:1.6}
.logincard input{width:100%;margin-top:9px;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:#181b20;color:var(--ink);font:inherit}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.btn{background:var(--acc);color:#1a1410;border:0;border-radius:9px;padding:10px 16px;font-weight:800}
.btn.full{width:100%;margin-top:12px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
/* 역무실 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px}.top h1 small{color:var(--sub);font-size:13px;font-weight:600;margin-left:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px;white-space:nowrap}
.hero{margin-top:14px;border-radius:14px;padding:18px;background:linear-gradient(135deg,#2c3a52,#232833);border:1px solid #3d4a62;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .t{flex:1;min-width:220px}.hero h2{margin:0 0 4px;font-size:21px}.hero p{margin:4px 0;color:#c8c2b2;font-size:13.5px;line-height:1.5}
.hero .go{font-size:18px;padding:14px 26px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.mi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--ink)}
.mi:hover,.mi:focus{border-color:var(--acc);outline:none}
.mi b{display:block;font-size:16px;margin-bottom:4px}.mi small{color:var(--sub);font-size:12.5px;line-height:1.45}
.foot{margin-top:18px;color:var(--sub);font-size:12px;text-align:center}
/* 시트 */
#sheet{position:fixed;inset:0;background:rgba(8,9,11,.82);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:10}
#sheet.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:820px;margin:auto 0}
.card h2{margin:0 0 6px;font-size:19px}.card h3{margin:16px 0 8px;font-size:15px;color:var(--acc)}
.card p{color:var(--sub);font-size:13.5px;line-height:1.55;margin:6px 0}
.list{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.it .nm{font-weight:700}.it .ds{color:var(--sub);font-size:12.5px}
.tag{font-size:12px;border-radius:12px;padding:2px 8px;background:#33373f;color:var(--sub);white-space:nowrap}
.tag.ok{background:#24402b;color:var(--good)}.tag.lock{background:#40282a;color:#e0a09a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.relic{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;color:var(--ink)}
.relic.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.relic.off{opacity:.38}
.relic b{display:block}.relic small{color:var(--sub);font-size:12px}
.g1{color:#c8c2b2}.g2{color:#7fc8ff}.g3{color:#ffd04a}
.big{font-size:40px;text-align:center;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--sub);font-weight:600}
tr.me td{color:var(--acc);font-weight:700}
.score{font-size:30px;font-weight:800;color:var(--acc)}
</style>
</head>
<body>
<!-- 로그인 -->
<div class="loginwrap" id="loginScreen">
  <div class="logincard">
    <div class="en">SHINJANG HIGH SCHOOL</div>
    <h1>신장고 통합과학<span>연구소</span></h1>
    <p>🚇 지하철 노선 탈출 · 역무실</p>
    <div id="loginStep1">
      <input id="loginName" placeholder="이름" autocomplete="username">
      <input id="loginPw" type="password" placeholder="비밀번호 (처음에는 학번)" autocomplete="current-password">
      <button class="btn full" id="loginBtn">로그인</button>
      <div class="err" id="loginErr"></div>
    </div>
    <div id="loginStep2" class="hide">
      <p>처음 로그인했어요. 새 비밀번호를 정해 주세요.</p>
      <input id="newPw1" type="password" placeholder="새 비밀번호 (4자 이상)">
      <input id="newPw2" type="password" placeholder="새 비밀번호 한 번 더">
      <button class="btn full" id="changeBtn">비밀번호 바꾸고 시작</button>
      <div class="err" id="changeErr"></div>
    </div>
    <p id="hoursNote" style="font-size:12px;margin-top:14px"></p>
  </div>
</div>

<!-- 역무실 -->
<div class="wrap hide" id="labApp">
  <div class="top">
    <h1>🏢 역무실<small>신장고 통합과학연구소</small></h1>
    <div class="pills"><span class="pill" id="who"></span><span class="pill" id="coinPill">🪙 -</span><button class="pill" id="logoutBtn">로그아웃</button></div>
  </div>
  <div class="hero">
    <div class="t">
      <h2>🚇 지하철 노선 탈출</h2>
      <p>기후 위기로 무너진 도시를 1~9호선을 따라 빠져나가자. 몬스터와 재난이 일으키는 상태 이상은 과학으로 대비해야 막을 수 있다.</p>
      <p id="heroInfo"></p>
    </div>
    <button class="btn go" id="goBtn">출발</button>
  </div>
  <div class="menu">
    <button class="mi" data-open="notes"><b>📓 연구 노트실</b><small>2학기 단원 평가(객관식·서술형). 처음 맞히면 코인을 받는다. 2회 수행평가 점수에 들어간다.</small></button>
    <button class="mi" data-open="gacha"><b>🎰 유물 뽑기</b><small>코인으로 유물을 뽑고, 판마다 3개를 장착한다.</small></button>
    <button class="mi" data-open="codex"><b>📖 도감</b><small>막아 낸 장비의 기능과 걸려 본 상태 이상이 남는다.</small></button>
    <button class="mi" data-open="rank"><b>🏆 순위</b><small>통과한 노선 수, 같으면 걸린 시간으로 매긴다. 통합·직업별.</small></button>
    <button class="mi" data-open="record"><b>📋 내 기록</b><small>2회 수행평가 점수와 지난 판 기록.</small></button>
  </div>
  <div class="foot">이용 시간: 평일 오전 8시 30분 ~ 월·화·금 오후 4시, 수·목 오후 5시</div>
</div>
<div id="sheet"><div class="card" id="sheetCard"></div></div>

<script src="supabase-config.js"></script>
<script src="lab_auth.js"></script>
<script type="module" src="station.js"></script>
</body>
</html>
