<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지하철 노선 탈출</title>
<style>
:root{--bg:#141619;--panel:#23262d;--panel2:#2c3039;--ink:#ece6d6;--sub:#a59f90;--acc:#e0b04a;--good:#6ad07a;--bad:#e0604a;--line:#3a3f4a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#141619}}
:root[data-theme="dark"]{--bg:#141619}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#hud[hidden]{display:none}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding:clamp(8px,1.6vw,18px);display:flex;justify-content:space-between;gap:8px;font-size:clamp(13px,1.5vw,18px)}
.bars{display:flex;flex-direction:column;gap:clamp(4px,.6vw,8px);width:clamp(200px,24vw,360px);background:rgba(10,12,16,.72);border:2px solid rgba(255,255,255,.18);border-radius:12px;padding:clamp(6px,.9vw,12px)}
.brow{display:flex;align-items:center;gap:8px}.brow b{width:1.4em;text-align:center;font-size:1.15em}
.bar{flex:1;height:clamp(14px,1.9vw,26px);background:rgba(0,0,0,.6);border:2px solid rgba(0,0,0,.8);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%}
.bar span{position:absolute;inset:0;font-size:clamp(11px,1.3vw,17px);line-height:clamp(14px,1.9vw,26px);text-align:center;color:#fff;font-weight:800;text-shadow:0 0 3px #000,0 0 3px #000}
#hpBar i{background:#d84a3a}#shBar i{background:#8aa8c8}#enBar i{background:#5ab0e0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:rgba(0,0,0,.66);border-radius:10px;padding:2px 9px;font-size:clamp(12px,1.25vw,17px);white-space:nowrap}
#statusChips .chip{font-size:clamp(15px,1.7vw,24px);font-weight:800;padding:3px 12px;border:2px solid rgba(255,255,255,.25)}
#right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(80vw,760px);background:rgba(20,22,26,.92);border:1px solid var(--acc);border-radius:8px;padding:8px 14px;font-size:clamp(14px,1.4vw,19px);pointer-events:none;opacity:0;transition:opacity .3s}
#tip.on{opacity:1}
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,13,.86);padding:16px;overflow:auto}
#screen.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:880px;width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:22px}.card h2{margin:0 0 10px;font-size:17px;color:var(--acc)}
.card p{margin:6px 0;color:var(--sub);font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.opt:hover,.opt:focus{border-color:var(--acc);outline:none}
.opt b{display:block;font-size:15px;margin-bottom:4px}.opt small{display:block;color:var(--sub);font-size:12px;line-height:1.45}
.opt.dis{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--acc);color:#1a1410;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.sign{display:flex;align-items:center;gap:8px;font-size:22px}
#touch{position:fixed;right:clamp(10px,2vw,28px);bottom:clamp(10px,2vw,28px);display:flex;gap:10px;flex-direction:column;align-items:flex-end;z-index:5}
#touch .wslot{pointer-events:none;background:rgba(10,12,16,.72);border:2px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;color:#fff;font-size:clamp(12px,1.3vw,16px);font-weight:700;text-align:right}
#runBtn{position:fixed!important;left:clamp(10px,2vw,28px);bottom:clamp(10px,2vw,28px);z-index:5}
#touch .r{display:flex;gap:8px}
#touch button,#runBtn{width:clamp(58px,6vw,84px);height:clamp(58px,6vw,84px);border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(30,32,38,.6);color:#fff;font:inherit;font-size:clamp(12px,1.3vw,16px);font-weight:800;cursor:pointer;position:relative}
#touch button.big{width:clamp(78px,8.5vw,118px);height:clamp(78px,8.5vw,118px);font-size:clamp(15px,1.6vw,20px);background:rgba(224,176,74,.35)}
#touch button[data-cd]::after{content:attr(data-cd);position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:1.3em}
button.down,#runBtn.down{background:rgba(224,176,74,.75)!important}
#touch button.down{background:rgba(224,176,74,.7)}
@media (pointer:coarse){#tip{bottom:auto;top:90px}}
#hud[hidden]~#touch{display:none}
canvas.pv{background:#3a4150;border-radius:6px;margin:0 auto 6px;width:96px;height:120px}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="640" height="360"></canvas></div>
<div id="hud" hidden>
  <div>
    <div class="bars">
      <div class="brow"><b>❤️</b><div class="bar" id="hpBar"><i></i><span></span></div></div>
      <div class="brow"><b>🛡️</b><div class="bar" id="shBar"><i></i><span></span></div></div>
      <div class="brow"><b>⚡</b><div class="bar" id="enBar"><i></i><span></span></div></div>
    </div>
    <div class="chips" id="statusChips"></div>
  </div>
  <div id="right"><div class="chip" id="where"></div><div class="chip" id="weaponChip"></div><div class="chip" id="skillChip"></div><div class="chip" id="itemChip"></div></div>
</div>
<div id="tip"></div>
<div id="touch"><div class="wslot" id="wslot"></div><div class="r"><button data-btn="item">소모품<br>E</button><button data-btn="swap">무기<br>Q</button></div><div class="r"><button data-btn="skill" id="skillBtn">스킬</button><button data-btn="attack" class="big">공격</button></div></div>
<button data-btn="run" id="runBtn">달리기<br>Shift</button>
<div id="screen"><div class="card" id="screenCard"></div></div>
<script src="../supabase-config.js"></script>
<script src="../lab_auth.js"></script>
<script type="module" src="client/app.js"></script>
</body>
</html>
