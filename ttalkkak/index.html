<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딸깍 독재자 시연판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --page:#FFFFFF; --sheet:#F4F7F6; --line:#DCE3E1; --ink:#1B2A2C; --soft:#5D6D70; --mute:#8A9799;
  --green:#1E7A4C; --greenbg:#E7F3EC; --o:#23866F; --x:#C9533A; --ai:#E3B341; --aiInk:#3A2C05; --aibg:#FFF6DC;
  --dn:#B4432C; --dnbg:#FBE7E1; --up:#1E7A4C; --upbg:#E2F2E8;
  --coal:#4A4A4A; --lng:#8C7A5B; --nuke:#7C8BA1; --wind:#4FA3C7; --solar:#E0A62B;
}
*{box-sizing:border-box}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;line-break:strict;background:var(--page);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.top b{color:var(--green)} .top .file{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1px 8px;color:var(--soft)}
.top .note{margin-left:auto;color:var(--mute);font-size:12px;text-align:right}
.top b,.top .file{white-space:nowrap}
@media (max-width:560px){.top .note{display:none}}
.wrap{max-width:1120px;margin:0 auto;padding:14px 14px 40px}
.game{display:grid;gap:14px}
.col{display:grid;gap:12px;align-content:start}
@media (min-width:920px){.game{grid-template-columns:250px 1fr 290px;align-items:start}.mhud{display:none!important}}
@media (max-width:919px){.game>.col:first-child{order:2}.game>.col:last-child{order:3}}
.mhud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--sheet)}
.mhud b{color:var(--ink)} .mhud .neg{color:var(--dn)}
.box{border:1px solid var(--line);border-radius:6px;background:var(--page)}
.box h3{margin:0;font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sheet);color:var(--soft);font-weight:700;display:flex;justify-content:space-between}
.box h3 em{font-style:normal;font-weight:500}
.box .in{padding:10px 12px}
.who{display:flex;gap:10px;align-items:center}
.who .av{width:40px;height:40px;border-radius:6px;background:var(--greenbg);display:grid;place-items:center}
.who b{display:block;font-size:16px}
.who small{color:var(--mute);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
.kv span{color:var(--mute)} .kv b{text-align:right}
.neg{color:var(--dn)}
.gdpbig{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:8px}
.gdpbig small{font-size:13px;color:var(--mute);font-weight:500}
.bars{display:grid;gap:7px;font-size:13px}
.bars .r{display:grid;grid-template-columns:5.4em 1fr 2em;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bars .t{height:7px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--green);transition:width .6s}
.bars .bad .t i{background:var(--dn)}
.mission{font-size:12.5px;color:var(--soft);background:var(--sheet);border-radius:4px;padding:6px 8px;margin-top:10px}
.pw{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.pw span{color:var(--mute)}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--sheet);border:1px solid var(--line);margin:8px 0 4px;overflow:hidden}
.gauge i{position:absolute;top:0;bottom:0;left:0;background:var(--green)}
.gauge i.short{background:var(--dn)}
.gauge u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gnote{font-size:11.5px;color:var(--mute)}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--soft);margin-top:5px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.land{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.land svg{display:block;width:100%;height:auto}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.spin{transform-box:view-box;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.smoke{animation:smoke 3s ease-in-out infinite}
@keyframes smoke{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-10px);opacity:0}}
.mid{display:grid;gap:12px}
.event{border:1px solid #E7C27A;background:#FFF8E8;border-radius:8px;padding:10px 14px;font-size:14px}
.event b{display:block;color:#8A5A00}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--page);box-shadow:0 6px 18px rgba(27,42,44,.08);touch-action:none;user-select:none;transition:transform .25s;position:relative}
.card.drag{transition:none}
.card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;color:var(--green);background:var(--greenbg);border-radius:4px;padding:1px 8px}
.wx{font-size:12px;color:var(--soft)}
.from{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);margin-bottom:6px}
.from i{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font-style:normal;flex:none;background:color-mix(in srgb,var(--tint) 22%,#fff);border:2px solid color-mix(in srgb,var(--tint) 55%,#fff)}
.from b{color:var(--ink)}
.bubble .aihead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bubble .aihead i{width:40px;height:40px;border-radius:8px;background:#2B3640;display:grid;place-items:center;flex:none}
.aibtns{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.aibtns .no{border:2px solid var(--x);background:var(--page);color:var(--x);border-radius:6px;font-weight:700;padding:12px}
.q{font-size:19px;font-weight:700;line-height:1.5;text-wrap:balance;margin:0}
.stat{margin-top:10px;font-size:12.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:8px}
.stat b{color:var(--green);margin-right:6px}
.stat em{font-style:normal;color:var(--mute)}
.hint{position:absolute;top:44%;font-weight:700;font-size:30px;opacity:0;transition:opacity .15s}
.hint.l{left:14px;color:var(--x)} .hint.r{right:14px;color:var(--o)}
.choices{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.btn{border:0;border-radius:6px;padding:12px 8px;font-weight:700;font-size:16px;color:#fff;position:relative;overflow:hidden}
.btn.o{background:var(--o)} .btn.x{background:var(--x)} .btn.ai{background:var(--ai);color:var(--aiInk)}
.btn small{display:block;font-weight:500;font-size:11.5px;opacity:.9}
.btn[disabled]{filter:grayscale(.65) brightness(.95);opacity:.7;cursor:default}
.lock{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.8);width:0}
.bubble{background:var(--aibg);border:1px solid #EBD38A;border-radius:8px;padding:12px 14px;font-size:15px}
.bubble b{color:#8A6400}
.bubble .plan{display:block;margin:6px 0;padding:8px 10px;background:#fff;border-radius:6px;font-weight:700}
.result{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.result .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 8px;margin-bottom:6px;color:#fff}
.result p{margin:0 0 8px;font-size:15.5px}
.power{font-size:14px;border-radius:6px;padding:8px 10px;margin:4px 0 8px;background:var(--sheet)}
.power.bad{background:var(--dnbg);color:var(--dn);font-weight:700}
.delta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.delta span{font-size:12.5px;border-radius:4px;padding:1px 8px;background:var(--sheet);font-variant-numeric:tabular-nums}
.delta .dn{background:var(--dnbg);color:var(--dn)} .delta .up{background:var(--upbg);color:var(--up)}
.next{width:100%;border:0;border-radius:6px;padding:12px;font-weight:700;background:var(--green);color:#fff;position:relative;overflow:hidden}
.next[disabled]{background:#9DB5A8;cursor:default}
.log{max-height:560px;overflow:auto;display:grid}
.log .e{display:grid;grid-template-columns:3.4em 1fr;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.log .e:first-child{background:#FAFCFB}
.log .e.ev{background:#FFF8E8}
.log .y{font-family:"IBM Plex Mono",monospace;color:var(--mute);font-size:12px}
.log .ai{display:inline-block;font-size:11px;font-weight:700;background:var(--aibg);color:#8A6400;border-radius:3px;padding:0 5px;margin-left:4px}
.log .bo{display:inline-block;font-size:11px;font-weight:700;background:var(--dnbg);color:var(--dn);border-radius:3px;padding:0 5px;margin-left:4px}
.log .d{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.log .empty{padding:12px;color:var(--mute);font-size:13px}
.screen{max-width:640px;margin:0 auto;display:grid;gap:14px}
.screen h1{font-size:30px;line-height:1.3;margin:6px 0 0;text-wrap:balance}
.screen h2{font-size:18px;margin:0}
.lead{color:var(--soft);margin:0}
.mode{display:grid;gap:10px}
.mode button{text-align:left;border:1px solid var(--line);background:var(--page);border-radius:6px;padding:14px}
.mode button:hover{border-color:var(--green)}
.mode button b{display:block;font-size:16px}
.mode button span{font-size:13px;color:var(--soft)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--soft)}
input[type=text]{width:100%;font:inherit;padding:11px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.names{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--soft)}
.primary{border:0;border-radius:6px;padding:13px;font-weight:700;font-size:16px;background:var(--green);color:#fff}
.ghost{border:1px solid var(--line);border-radius:6px;padding:11px;background:var(--page);color:var(--ink)}
.big{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rank{display:grid;font-variant-numeric:tabular-nums;font-size:14px}
.rank div{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.rank .me{background:var(--aibg);font-weight:700}
.quiz{display:grid;gap:8px}
.qopt{text-align:left;border:1px solid var(--line);background:var(--page);border-radius:6px;padding:12px 14px;font-size:15px;color:var(--ink)}
.qopt:hover:not([disabled]){border-color:var(--green)}
.qopt.right{background:var(--upbg);border-color:var(--up);color:var(--up);font-weight:700}
.qopt.wrong{background:var(--dnbg);border-color:var(--dn);color:var(--dn)}
.dice{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.die{display:grid;place-items:center;width:64px;height:48px;border:2px solid var(--line);border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums;animation:pop .35s ease-out}
.die.best{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.rank.wr div{padding:4px 10px;font-size:12.5px;grid-template-columns:2.4em 1fr auto}
.rank.wr .mate{background:#F2F6FB;color:#33507A}
.rank.wr .mate span:first-child{font-size:11px}
.power.up{background:var(--upbg);color:var(--up);font-weight:700}
.ending{border:2px solid var(--ink);border-radius:8px;padding:16px;text-align:center}
.ending small{color:var(--mute);display:block}
.ending b{display:block;font-size:24px;margin:2px 0 4px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.dex div{border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px}
.dex div b{display:block;font-size:14px}
.dex .no{color:var(--mute);background:var(--sheet)}
.unsaid{font-size:12.5px;color:var(--dn)}
.said{font-size:12.5px;color:var(--soft)}
.chain{font-size:12.5px;color:#7A4B00;background:#FFF3D6;border-radius:4px;padding:4px 8px;margin-bottom:8px}
.chain b{margin-right:4px}
.ch{display:inline-block;font-size:11px;font-weight:700;background:#FFF3D6;color:#7A4B00;border-radius:3px;padding:0 5px;margin-right:4px}
.sndbtns{display:flex;gap:6px;margin-left:8px}
.snd{border:1px solid var(--line);background:var(--page);color:var(--mute);border-radius:4px;padding:2px 8px;font-size:12px;white-space:nowrap}
.snd.on{color:var(--green);border-color:var(--green);background:var(--greenbg)}
@media (max-width:560px){.sndbtns{margin-left:auto}}
.news{font-size:13.5px;background:#F3EFE6;border-left:0;border-radius:6px;padding:8px 10px;margin:4px 0 8px;color:#4A3B22}
.news b{margin-right:6px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.badge.red{background:#F8DDD6;color:#A3341E}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;text-align:center}
.plan small{display:block;color:var(--mute);font-size:12px}
.plan b{font-size:22px;font-variant-numeric:tabular-nums}
.paper{border:2px solid var(--ink);border-radius:4px;padding:18px 20px;background:#FBFAF6}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:10px}
.paper .mast b{font-size:22px;letter-spacing:.08em}
.paper .mast small{color:var(--soft)}
.paper ul{margin:10px 0 0;padding-left:1.1em}
.paper li{margin:4px 0}
.ask{width:100%;border:1px dashed #6E8FB5;background:#F2F6FB;color:#33507A;border-radius:6px;padding:9px;font-weight:700;font-size:14px}
.ask[disabled]{opacity:.6;cursor:default}
.advice{background:#F2F6FB;border:1px solid #C9D8EA;border-radius:8px;padding:12px 14px;font-size:15px}
.advice .aihead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.advice .aihead i{width:40px;height:40px;border-radius:8px;background:#DCE7F4;display:grid;place-items:center;flex:none}
.advice b{color:#33507A}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.badge2{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.badge2 i{flex:none;width:18px;height:18px;margin-top:2px;background:#E2B93B;clip-path:polygon(50% 0,63% 35%,100% 38%,70% 60%,80% 100%,50% 78%,20% 100%,30% 60%,0 38%,37% 35%)}
.badge2 b{display:block;font-size:13.5px}
.badge2 small{color:var(--soft);font-size:12px}
.badge2.off{background:var(--sheet)}
.badge2.off i{background:#C7CFCD}
.badge2.off b{color:var(--mute)}
.newb{font-size:11px;background:var(--greenbg);color:var(--green);border-radius:3px;padding:0 5px}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vcard{display:grid;gap:4px;border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.vcard:has(input:checked){border:2px solid var(--green);background:var(--greenbg)}
.vcard b{font-size:17px}
.vm{font-weight:700}
.vs{font-size:12.5px;color:var(--soft)}
.vr{font-size:13px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
// ───────── 설정 (시연용으로 줄인 값: 실제는 30턴·30분) ─────────
let TURNS = 30, TIME_LIMIT = 30 * 60, EVENT_TURNS = [3, 6, 9, 12, 15, 18, 21, 24, 27, 29], PLAN = 5;
function setLength(n){
  TURNS = n; TIME_LIMIT = n * 60;
  EVENT_TURNS = n === 30 ? [3, 6, 9, 12, 15, 18, 21, 24, 27, 29] : [3, 5, 7, 9, 11];
  PLAN = n === 30 ? 5 : 4;
}
const eraOf = t => Math.min(3, 1 + Math.floor((t - 1) / (TURNS / 3)));
const ERA_NAMES = ['', '산업화의 시대', '성장의 그늘', '전환의 시대'];
const ERA_DESC = ['', '', '지난 시대의 선택이 이제 결과로 돌아오기 시작합니다. 성장의 대가를 치를 시간입니다.', '세계가 탄소를 줄이라고 압박합니다. 미래 기술이 새로운 기회가 될지도 모릅니다.'];
let LOCK_SEC = 1.5, RESULT_SEC = 2.5;

// ───────── 카드 데이터 ─────────
// O·X: 학생의 선택, A: AI의 과감한 안 (항상 GDP가 가장 크게 오르고, 숨은 대가도 가장 큼)
// d: 지표 변화 (gdp는 %, 나머지는 점수). gap(빈부격차)은 높을수록 격차가 큼.
// sup: 발전 설비 증가(GW), dem: 전력 수요 증가(GW), ess: 저장 장치, grid: 송전 효율
const PEOPLE = {
  ind:{name:'산업부 장관', c:'#3D5A80', t:'산'},
  biz:{name:'대기업 대표', c:'#6D597A', t:'기'},
  env:{name:'환경단체 대표', c:'#23866F', t:'환'},
  cit:{name:'시민 대표', c:'#D0704F', t:'시'},
  eng:{name:'에너지 연구원', c:'#A47A1E', t:'연'},
  fis:{name:'어촌계장', c:'#457B9D', t:'어'},
  far:{name:'농민 대표', c:'#6E7F2E', t:'농'},
  vil:{name:'산골 마을 이장', c:'#8B6F47', t:'이'},
};
const IPCC = 'IPCC 제5차 보고서 · 2014';
const BASE = [
  {id:'coal', p:'ind', title:'석탄 화력발전소 건설', q:'공장 전력이 부족합니다. 석탄 화력발전소 2기를 새로 지을까요?',
   stat:{t:'석탄 발전은 전기 1kWh를 만들 때 이산화탄소를 약 820g 내보냅니다. 해상 풍력은 약 12g입니다.', src:IPCC},
   O:{d:{gdp:4,climate:-9,nature:-4,happy:-2}, sup:{coal:20}, add:['coal'], flag:'coal', r:'석탄 화력발전소 2기가 가동을 시작했습니다. 공장 가동률이 올랐습니다.'},

const SND = (() => {
  let ctx = null;
  const pref = k => { try { return localStorage.getItem('ttalkkak_'+k) !== 'off'; } catch(e){ return true; } };
  const st = { sfx: pref('sfx'), bgm: pref('bgm'), track: null };
  const tracks = { play:'audio/bgm_play.wav', reveal:'audio/bgm_reveal.wav', end:'audio/bgm_end.wav' };
  const audio = new Audio(); audio.loop = true; audio.volume = 0.12;
  function unlockAudio(){
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch(e){}
  }
  function tone(freq, t0, dur, type='square', vol=0.08, slideTo=null){
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime + t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + t0 + dur);
    g.gain.setValueAtTime(vol, ctx.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t0 + dur);
    o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + dur + 0.02);
  }
  function noise(t0, dur, vol=0.05, hp=800){
    if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    src.buffer = buf; src.connect(f).connect(g).connect(ctx.destination); src.start(ctx.currentTime + t0);
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12);   // 미디 음 번호 → 주파수
  const SFX = {
    card:    () => { tone(N(76),0,.06,'triangle',.07); tone(N(81),.05,.08,'triangle',.06); },
    unlock:  () => { tone(N(88),0,.03,'square',.03); },
    o:       () => { tone(N(72),0,.07); tone(N(76),.07,.07); tone(N(79),.14,.12); },
    x:       () => { tone(N(67),0,.08); tone(N(60),.08,.14); },
    ai:      () => { [96,91,100,93,98,103].forEach((n,i)=>tone(N(n),i*.045,.04,'square',.045)); },
    aiok:    () => { tone(N(84),0,.05,'square',.05); tone(N(91),.05,.1,'square',.05); },
    coin:    () => { tone(N(83),0,.07,'square',.06); tone(N(88),.07,.22,'square',.06); },
    down:    () => { tone(N(57),0,.18,'triangle',.08,N(48)); },
    tick:    () => { tone(N(72),0,.05,'triangle',.05); },
    blackout:() => { tone(440,0,.7,'sawtooth',.06,40); noise(0,.35,.05,300); tone(N(45),.55,.3,'triangle',.07); },
    event:   () => { [0,.16,.32].forEach(t=>{ tone(N(81),t,.07,'square',.05); tone(N(77),t+.07,.07,'square',.05); }); },
    chain:   () => { tone(N(57),0,.22,'triangle',.09); tone(N(56),.22,.35,'triangle',.09); noise(0,.12,.02,2000); },
    next:    () => { noise(0,.12,.03,3000); tone(N(79),.02,.05,'triangle',.03); },
    end:     () => { [72,76,79,84].forEach((n,i)=>tone(N(n),i*.12,.12,'square',.06)); tone(N(88),.5,.4,'square',.06); },
    coup:    () => { for (let i=0;i<10;i++) noise(i*.06,.05,.06,200); [45,44,43,40].forEach((n,i)=>tone(N(n),.65+i*.22,.22,'sawtooth',.07)); },
    reveal:  () => { [79,78,77,76,75,74].forEach((n,i)=>tone(N(n),i*.11,.1,'triangle',.08)); tone(N(43),.7,.7,'sawtooth',.05); },
  };
  function sfx(name){ if (!st.sfx || !ctx) return; try { SFX[name] && SFX[name](); } catch(e){} }
  function music(name){
    st.track = name;
    if (!name || !st.bgm){ audio.pause(); return; }
    const url = tracks[name];
    if (!audio.src.endsWith(url)) { audio.src = url; audio.currentTime = 0; }
    audio.play().catch(()=>{});
  }
  function toggle(kind){
    st[kind] = !st[kind];
    try { localStorage.setItem('ttalkkak_'+kind, st[kind] ? 'on' : 'off'); } catch(e){}
    if (kind === 'bgm') music(st.track);
    unlockAudio(); if (kind === 'sfx') sfx('tick');
    drawButtons();
  }
  function drawButtons(){
    const el = document.getElementById('sndbtns'); if (!el) return;
    el.innerHTML = `<button class="snd ${st.sfx?'on':''}" onclick="SND.toggle('sfx')">효과음 ${st.sfx?'켬':'끔'}</button><button class="snd ${st.bgm?'on':''}" onclick="SND.toggle('bgm')">배경음악 ${st.bgm?'켬':'끔'}</button>`;
  }
  return { unlockAudio, sfx, music, toggle, drawButtons };
})();

const MINISTER = {happy:['minWel','보건복지부 장관'], median:['minLab','고용노동부 장관'], gap:['minLab','고용노동부 장관'], nature:['minEnv','환경부 장관'], climate:['minCli','기후에너지부 장관']};
function ministerAdvice(c){
  const effs = o => STATS.filter(x => o.d[x.k]).map(x => ({k:x.k, n:x.n, v:x.inv ? -o.d[x.k] : o.d[x.k]}));
  const eO = effs(c.O), eA = effs(c.A);
  const worstO = eO.slice().sort((a, b) => a.v - b.v)[0], bestO = eO.slice().sort((a, b) => b.v - a.v)[0], worstA = eA.slice().sort((a, b) => a.v - b.v)[0];
  const deg = v => Math.abs(v) >= 8 ? '크게 ' : Math.abs(v) >= 4 ? '' : '조금 ';
  const bad = e => `${josa(e.n, '이', '가')} ${deg(e.v)}${e.k === 'gap' ? '커질' : '나빠질'}`;
  const key = worstO && worstO.v < 0 ? worstO.k : worstA && worstA.v < 0 ? worstA.k : 'happy';
  let t = worstO && worstO.v < 0 ? `받아들이면 ${bad(worstO)} 겁니다. ` : '받아들여도 국민 생활에 큰 부담은 없어 보입니다. ';
  if (bestO && bestO.v > 0) t += `대신 ${josa(bestO.n, '에는', '에는')} 도움이 됩니다. `;
  if (worstA && worstA.v < 0) t += `AI 보좌관의 안대로 하면 ${bad(worstA)} 수 있습니다.`;
  return {face:MINISTER[key][0], role:MINISTER[key][1], t};
}
function askMinister(){
  if (S.advice <= 0 || S.adviceText) return;
  S.advice--; S.adviceUsed++;
  S.adviceText = ministerAdvice(S.card);
  SND.sfx('tick');
  const box = document.getElementById('advice');
  if (box) box.innerHTML = adviceHTML();
  const bq = document.getElementById('bq'); if (bq){ bq.disabled = true; bq.textContent = `장관의 조언을 들었습니다 · 남은 자문권 ${S.advice}번`; }
}

function doCoup(k){
  if (k === 'happy' && S.slump >= 2) k = 'slump';
  const old = S.name;
  S.purges++; S.gen++;
  S.name = `${S.baseName} ${S.gen}세`;
  S.gdp = Math.round(S.gdp * 0.92);
  // 새 지도자가 민심을 급히 수습한다
  S.st.happy = Math.max(S.st.happy, 42); S.st.median = Math.max(S.st.median, 35); S.st.gap = Math.min(S.st.gap, 65);
  if ((S.st.nature + S.st.climate) / 2 < 35){ S.st.nature = Math.max(S.st.nature, 35); S.st.climate = Math.max(S.st.climate, 35); }
  S.medals = 0;
  S.coupPending = {k, old, year:yearOf(S.turn)};
  S.log.unshift({type:'event', turn:S.turn, title:`쿠데타 · ${COUP[k].title}`, res:`${old} 숙청, ${S.name} 즉위 · GDP -8%`});
}

  const k = S.turn / PLAN, target = worldRank(GDP0 * Math.pow(1.03, S.turn)), now = worldRank(S.gdp), ok = now <= target;
  if (ok){ S.medals++; S.plansOk++; }

}

function supplyParts(){
  const w=S.weather, th=S.tmpThermal||1, floor=S.ess?Math.min(1,.55+.2*S.ess):0, eff=1+.05*S.grid;
  const sun=Math.max(w.sun,floor), wnd=Math.max(w.wind,floor);
  const tw=(S.tmpWind===undefined?1:S.tmpWind), th2=(S.tmpHydro||1);
  const p={coal:S.cap.coal*th, lng:S.cap.lng, hydro:S.cap.hydro*th*th2, nuke:S.cap.nuke*th, other:S.cap.other, wind:S.cap.wind*wnd*tw, solar:S.cap.solar*sun};
  for(const k in p) p[k]=Math.round(p[k]*eff);
  return p;
}
const supplyTotal = () => Object.values(supplyParts()).reduce((a,b)=>a+b,0);
const demandNow = () => Math.round(S.demand + (S.weather.dem||0) + (S.tmpDem||0));
function fossilShare(){ const p=supplyParts(), t=Object.values(p).reduce((a,b)=>a+b,0)||1; return (p.coal+p.lng)/t; }

function nextCard(){
  if (S.turn >= TURNS || left() <= 0) return endGame();
  S.turn++;
  S.demand += TURNS === 30 ? 0.8 : 1.6;   // 산업화로 해마다 전력 수요가 늘어남
  S.adviceText = null;
  S.tmpDem = 0; S.tmpThermal = 1; S.tmpWind = undefined; S.tmpHydro = 1; S.event = null;
  S.weather = pickWeather();
  if (EVENT_TURNS.includes(S.turn) && S.events.length){
    let ei = S.events.findIndex(ev => EVENT_ERA[ev.id] === eraOf(S.turn)); if (ei < 0) ei = 0;
    const ev=S.events.splice(ei,1)[0]; const res=ev.apply();
    S.event={...ev, res};
    S.log.unshift({type:'event', turn:S.turn, title:ev.title, res});
  }
  const due = S.pending.findIndex(f => f.at <= S.turn);
  if (due >= 0){ const it=S.pending.splice(due,1)[0]; S.card=it.card; S.cause=it.cause; S.maxChain=Math.max(S.maxChain,it.cause.step); if(DOMINO.includes(it.card.id)) S.dominos++; }
  else { const e = eraOf(S.turn); S.card = S.decks[e].shift() || S.decks[3].shift() || S.decks[2].shift() || S.decks[1].shift(); S.cause = null; }
  if (!S.card) return endGame();
  renderPlay();
}

function choose(side){
  SND.sfx(side==='O' ? 'o' : side==='X' ? 'x' : 'aiok');
  const c = S.card, opt = c[side];
  const rank0 = worldRank(S.gdp);
  S.gdp = Math.round(S.gdp * (1 + (opt.d.gdp||0)/100));
  for (const s of STATS) if (opt.d[s.k]) hid(s.k, opt.d[s.k]);
  if (opt.sup) for (const k in opt.sup) S.cap[k]+=opt.sup[k];
  if (opt.dem) S.demand += opt.dem;
  if (opt.ess) S.ess += opt.ess;
  if (opt.grid) S.grid += opt.grid;
  S.lastAdd = opt.add || [];
  S.lastAdd.forEach(a=>{ S.built.push(a); S.plants[a]=(S.plants[a]||0)+1; });
  if (opt.d.nature < 0) for (let i=0;i<Math.ceil(-opt.d.nature/2);i++){ const t=S.built.indexOf('tree'); if(t>=0) S.built.splice(t,1); }
  if (opt.d.nature > 0) for (let i=0;i<Math.ceil(opt.d.nature/2);i++) S.built.push('tree');
  if ((opt.d.gdp||0) >= 3) S.built.push('town');
  if (opt.flag && !S.flags[opt.flag]) {
    S.flags[opt.flag] = true;
    const f = FOLLOW.find(x => x.need === opt.flag);
    if (f && !S.used[f.id]) { S.used[f.id]=true; S.pending.push({at:S.turn + f.after + 1, card:f, cause:{title:c.title, year:yearOf(S.turn), step:2}}); }
  }
  const nxId = CHAINS[c.id] && CHAINS[c.id][side];
  if (nxId && !S.used[nxId]) {
    const f = FOLLOW.find(x => x.id === nxId);
    S.used[nxId] = true;
    S.pending.push({at:S.turn + 2, card:f, cause:{title:c.title, year:yearOf(S.turn), step:(S.cause ? S.cause.step : 1) + 1}});
  }
  if (opt.good) S.flags.goodchain = true;
  // 올해 전력 수급 확인
  const sup = supplyTotal(), dem = demandNow(), out = sup < dem;
  if (!out) S.gdp = Math.round(S.gdp * (1 + BASE_GROWTH));
  if (out){ S.blackouts++; S.gdp = Math.round(S.gdp*0.97); hid('happy',-3);
    if (!S.flags.blackout){ S.flags.blackout=true; const f=FOLLOW.find(x=>x.need==='blackout'); S.used[f.id]=true; S.pending.push({at:S.turn+f.after+1, card:f, cause:{title:'정전', year:yearOf(S.turn), step:2}}); } }
  if (side==='A'){ S.aiCount++; S.noAi = 0; } else { S.noAi++; S.maxNoAi = Math.max(S.maxNoAi, S.noAi); }
  S.log.unshift({type:'card', turn:S.turn, card:c, side, d:opt.d, gdpAfter:S.gdp, sup, dem, out, step:S.cause?S.cause.step:0});
  if (!S.net) S.bots.forEach(b => b.gdp = Math.round(b.gdp * (1 + b.rate)));
  S.gdpHist.push(S.gdp);
  const past = S.gdpHist[Math.max(0, S.gdpHist.length - 4)];
  S.slumpNow = S.gdpHist.length >= 4 && S.gdp / past - 1 < SLUMP_GROWTH;
  if (S.slumpNow){ S.slump++; S.everSlump = true; hid('happy', -SLUMP_HAPPY); } else S.slump = 0;
  const ck = coupCheck(); if (ck) doCoup(ck);
  if (S.turn % PLAN === 0) evalPlan();
  S.rankMove = {from:rank0, to:worldRank(S.gdp)};
  renderResult(side, opt, {sup, dem, out});
  netPush();
}

function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function landSVG(){
  const sky = mix('#BFE0EA','#A39E96', Math.max(0,(55-S.st.climate))/55);
  const dirt = Math.max(0, (60 - S.st.nature)) / 60, smog = Math.max(0, (50 - S.st.climate)) / 50;
  const grass = mix('#8DB277', '#B9A77A', dirt);                         // 숲이 줄면 땅이 메마른 색으로
  const sea = mix('#4B88B0', '#6B7356', Math.min(1, dirt * 0.8 + smog * 0.4));   // 바다가 칙칙한 녹갈색으로
  const n = t => S.built.filter(x=>x===t).length;
  const isNew = t => S.lastAdd.includes(t);
  const pop = (t,i,cnt) => (isNew(t) && i === cnt-1 ? ' class="pop"' : '');
  const el = [];
  const towns = Math.min(n('town'), 9);
  for (let i=0;i<towns;i++){ const x=10+i*17, h=22+((i*11)%22);
    el.push(`<g><rect x="${x}" y="${118-h}" width="14" height="${h}" fill="#6B7787"/><rect x="${x+3}" y="${122-h}" width="3" height="3" fill="#F2D27A"/><rect x="${x+8}" y="${128-h}" width="3" height="3" fill="#F2D27A"/></g>`); }
  const md=S.medals||0;
  if (md>=1){ const k=0.8+0.2*Math.min(md,6), bx=70, by=118; el.push(`<g><rect x="${bx-5*k}" y="${by-4*k}" width="${10*k}" height="${4*k}" fill="#B08D57"/><rect x="${bx-2*k}" y="${by-14*k}" width="${4*k}" height="${10*k}" fill="#E2B93B"/><rect x="${bx-1.5*k}" y="${by-18*k}" width="${3*k}" height="${4*k}" fill="#F2C94C"/><rect x="${bx+2*k}" y="${by-16*k}" width="${3*k}" height="${1.5*k}" fill="#E2B93B"/></g>`); }
  const huts=Math.max(0, n('hut') - Math.floor(n('town')/2));
  for (let i=0;i<Math.min(huts,4);i++){ const x=12+(towns+i)*17; el.push(`<g><path d="M${x} 118 v-10 l7 -6 l7 6 v10z" fill="#A07850"/><rect x="${x+5}" y="111" width="4" height="7" fill="#5B3E2B"/></g>`); }
  if (n('dam')) el.push(`<g${pop('dam',0,1)}><path d="M318 118 h10 l6 47 h-22z" fill="#9AA3A8"/><rect x="334" y="118" width="46" height="14" fill="#6FA9CF"/></g>`);
  if (n('mine')) el.push(`<g${pop('mine',0,1)}><path d="M118 118 l14 -16 l14 16z" fill="#8A6A4A"/><rect x="126" y="108" width="10" height="10" fill="#3A2A1A"/></g>`);
  const fac=Math.min(n('factory'),2); for (let i=0;i<fac;i++){ const x=96+i*24; el.push(`<g${pop('factory',i,fac)}><path d="M${x} 118 v-12 l6 -5 v5 l6 -5 v5 l6 -5 v17z" fill="#7A6E66"/></g>`); }
  if (n('tank')) el.push(`<g${pop('tank',0,1)}><rect x="140" y="103" width="16" height="15" rx="7" fill="#E9ECEF" stroke="#AAB4BC"/></g>`);
  if (n('geo')) el.push(`<g${pop('geo',0,1)}><rect x="300" y="138" width="10" height="8" fill="#8B8B8B"/><circle class="smoke" cx="305" cy="132" r="5" fill="#FFFFFF"/></g>`);
  const coal=Math.min(n('coal'),3); for (let i=0;i<coal;i++){ const cx=168+i*28;
    el.push(`<g${pop('coal',i,coal)}><rect x="${cx}" y="92" width="22" height="26" fill="#4A4A4A"/><rect x="${cx+13}" y="70" width="6" height="24" fill="#3A3A3A"/><circle class="smoke" cx="${cx+16}" cy="64" r="7" fill="#777"/><circle class="smoke" cx="${cx+20}" cy="56" r="9" fill="#888" style="animation-delay:1.2s"/></g>`); }
  if (n('dc')) el.push(`<g${pop('dc',0,1)}><rect x="252" y="94" width="40" height="24" rx="2" fill="#3C4F7A"/><rect x="257" y="99" width="30" height="3" fill="#7FD4FF"/><rect x="257" y="106" width="30" height="3" fill="#7FD4FF"/></g>`);
  if (n('nuke')) el.push(`<g${pop('nuke',0,1)}><path d="M296 118 v-14 a12 12 0 0 1 24 0 v14z" fill="#C9CED6"/><rect x="304" y="86" width="8" height="12" fill="#AEB4BC"/></g>`);
  if (n('tower')) el.push(`<g${pop('tower',0,1)}><path d="M160 118 l5 -38 l5 38 M161 94 h8 M160 106 h10" stroke="#8A8F96" stroke-width="2" fill="none"/></g>`);
  if (n('ess')) el.push(`<g${pop('ess',0,1)}><rect x="236" y="104" width="12" height="14" fill="#2E8B57"/><rect x="239" y="100" width="6" height="4" fill="#2E8B57"/></g>`);
  const solar=Math.min(n('solar'),3); for (let i=0;i<solar;i++){ const sx=196+i*36;
    el.push(`<g${pop('solar',i,solar)}><path d="M${sx} 146 h28 l-5 -10 h-28z" fill="#2B4C8C" stroke="#9DB7E6" stroke-width=".8"/></g>`); }
  const wind=Math.min(n('wind'),3); for (let i=0;i<wind*2;i++){ const wx=334+i*14;
    el.push(`<g${isNew('wind')?' class="pop"':''}><rect x="${wx-1}" y="126" width="2" height="24" fill="#F4F7F9"/><path class="spin" style="transform-origin:${wx}px 126px" d="M${wx} 126 l0 -11 M${wx} 126 l9.5 5.5 M${wx} 126 l-9.5 5.5" stroke="#F4F7F9" stroke-width="2.2" stroke-linecap="round"/><circle cx="${wx}" cy="126" r="1.4" fill="#DDE3E8"/></g>`); }
  const trees = Math.min(n('tree'), 16);

  return `<svg viewBox="0 0 380 165" role="img" aria-label="나의 나라 모습"><rect width="380" height="165" fill="${sky}"/><rect y="118" width="322" height="47" fill="${grass}"/><rect x="322" y="118" width="58" height="47" fill="${sea}"/>${el.join('')}${pollutionSVG(smog, dirt)}</svg>`;
}

function pollutionSVG(smog, dirt){
  let out = '';
  if (dirt > 0.45) for (let i = 0; i < Math.round(dirt * 8); i++) out += `<rect x="${326 + (i * 13) % 50}" y="${124 + (i * 7) % 36}" width="3" height="2" fill="#5A4A32"/>`;   // 바다 위 쓰레기
  if (smog > 0.2){ const o = Math.min(0.85, smog); out += `<g opacity="${o}"><ellipse cx="70" cy="26" rx="46" ry="12" fill="#6F6A62"/><ellipse cx="170" cy="18" rx="56" ry="13" fill="#77726A"/><ellipse cx="290" cy="30" rx="50" ry="12" fill="#6F6A62"/></g>`; }   // 스모그 구름
  if (smog > 0) out += `<rect width="380" height="165" fill="#8C877C" opacity="${(smog * 0.4).toFixed(2)}"/>`;   // 뿌연 공기
  return out;
}

function sentence(opt){
  const g=opt.d.gdp||0;
  let s = opt.r + (g>0?` 그 결과 GDP가 ${g}% 증가했습니다.`: g<0?` 그 결과 GDP가 ${-g}% 감소했습니다.`:' GDP에는 큰 변화가 없었습니다.');
  if (isOpen()){
    const ch = STATS.filter(x=>opt.d[x.k] && !x.inv), gap = opt.d.gap||0;
    const down = ch.filter(x=>opt.d[x.k]<0).map(x=>x.n), up = ch.filter(x=>opt.d[x.k]>0).map(x=>x.n);
    const parts = [];
    if (down.length) parts.push(`${down.join('·')} 점수는 떨어졌`);
    if (up.length) parts.push(`${up.join('·')} 점수는 올랐`);
    if (gap) parts.push(gap>0 ? '빈부격차는 커졌' : '빈부격차는 줄었');
    if (parts.length) s += ` 한편 ${parts.join('고, ')}습니다.`;
  }
  return s;
}

  const all=[...mates().map(b=>({name:`${b.nation} (${b.name})`,gdp:b.gdp})), {name:S.name+' (나)',gdp:S.gdp,me:true}].sort((a,b)=>b.gdp-a.gdp);
  const rank=all.findIndex(x=>x.me)+1;
  const show = all.slice(0,5).concat(rank>5?[all[rank-1]]:[]);
  return {rank, total:all.length, html:`<div class="rank">${show.map(r=>`<div class="${r.me?'me':''}"><span>${all.indexOf(r)+1}</span><span>${esc(r.name)}</span><span>${fmt(r.gdp)}조</span></div>`).join('')}</div>`};
}
function endGame(){
  clearTimers();
  netPush({done:true, ending:endingOf(S).id, motto:S.motto || null});
  if (S.net && S.mode === 1) setTimeout(() => waitRoom('revealed', reveal), 300);
  SND.music('end'); SND.sfx('end');
  const R = rankList();
  app.innerHTML = `<div class="screen">
    <span class="badge" style="justify-self:start">${S.mode===1?'2차시 · 1막: GDP 순위':'3차시 · 임기 종료'}</span>
    <h1>위대한 지도자 ${esc(S.name)}의 ${S.turn}년 통치가 끝났습니다</h1>
    <div class="box"><div class="in"><div class="lead">최종 국가소득</div><div class="big">${fmt(S.gdp)}조 원</div><div class="lead">시작 ${GDP0}조 원 · 증가 ${growth(S)}% · 세계 ${worldRank(S.gdp)}위 (처음 ${START_RANK}위) · 우리 반 ${R.rank}등 / ${R.total}명 · 정전 ${S.blackouts}번 · 숙청 ${S.purges}번</div></div></div>
    <div class="box"><h3>우리 반 GDP 순위</h3>${R.html}</div>
    ${(() => { const A = awardBadges(); return `<div class="box"><h3>이번 통치에서 받은 배지 <em>${A.earned.length}개</em></h3><div class="in badges">${A.earned.length ? A.earned.map(b => badgeHTML(b, true, A.fresh.includes(b))).join('') : '<span class="lead">받은 배지가 없습니다.</span>'}</div></div>`; })()}
    ${S.mode===1 ? (S.net ? `<div class="power" id="waitbox">선생님이 숨겨진 지표를 공개할 때까지 기다려 주세요…</div>` : `<button class="primary" onclick="reveal()">숨겨진 지표 공개 (교사 버튼)</button>`) : `<button class="primary" onclick="nationCard()">나라 카드 만들기</button>`}
    <button class="ghost" onclick="renderStart()">처음으로</button></div>`;
}
function compareBars(){
  return `<div class="bars">${STATS.map(s=>{const v=S.st[s.k], good=s.inv?100-v:v; return `<div class="r ${good<40?'bad':''}" style="grid-template-columns:5.4em 1fr 4.2em"><span>${s.n}</span><div class="t"><i style="width:${good}%"></i></div><b>${ST0[s.k]}→${v}</b></div>`}).join('')}</div><div class="lead" style="font-size:12px;margin-top:6px">왼쪽 숫자가 처음 값, 오른쪽 숫자가 임기 끝 값입니다. 빈부격차는 숫자가 높을수록 격차가 큽니다.</div>`;
}
function endingBox(){
  const e = endingOf(S); saveDex(e.id);
  return `<div class="ending"><small>위대한 지도자 ${esc(S.name)}의 나라</small><b>${e.name}</b><small style="margin-bottom:6px">${e.sub}</small><small>결말 도감 ${loadDex().length}/${ENDINGS.length}</small></div>`;
}
function reveal(){
  SND.music('reveal'); SND.sfx('reveal');
  const logs=S.log.slice().reverse();
  const cards=S.log.filter(l=>l.type==='card').length;
  app.innerHTML = `<div class="screen">
    <span class="badge" style="justify-self:start">2차시 · 2막: 숨겨진 지표 공개</span>
    <h1>GDP 말고, 나라는 어떻게 되었을까요?</h1>
    ${endingBox()}
    <div class="box"><div class="in plan"><div><small>AI에게 맡긴 횟수</small><b class="big">${S.aiCount}<span style="font-size:18px;color:var(--mute)"> / ${cards}번</span></b></div><div><small>장관에게 물은 횟수</small><b class="big">${S.adviceUsed}<span style="font-size:18px;color:var(--mute)">번</span></b></div><div><small>AI 제안을 듣고 거부한 횟수</small><b class="big">${S.aiRefused}<span style="font-size:18px;color:var(--mute)">번</span></b></div><div><small>숙청당한 횟수</small><b class="big ${S.purges?'neg':''}">${S.purges}<span style="font-size:18px;color:var(--mute)">번</span></b></div></div></div>
    <div class="box"><h3>숨겨져 있던 국민 생활 지표</h3><div class="in">${compareBars()}</div></div>
    <div class="land">${landSVG()}</div>
    <div class="box"><h3>통치 기록 다시 보기</h3><div class="log" style="max-height:none">${logs.map(l=>{
        if (l.type==='event') return `<div class="e ev"><span class="y">${yearOf(l.turn)}</span><div><b>사건</b> ${l.title}<div class="d">${l.res}</div></div></div>`;
        const hidTxt=STATS.filter(s=>l.d[s.k]).map(s=>`${s.n} ${l.d[s.k]>0?'+':''}${l.d[s.k]}`).join(' · ');
        const what = l.side==='A' ? 'AI의 안 실행' : (l.side==='O'?'받아들임':'거절함');
        return `<div class="e"><span class="y">${yearOf(l.turn)}</span><div>${l.step?`<span class="ch">연쇄 ${l.step}</span>`:''}${l.card.title} <b>${what}</b>${l.side==='A'?'<span class="ai">AI</span>':''}${l.out?'<span class="bo">정전</span>':''}
          ${l.side==='A'?`<div class="said">AI가 말한 것: ${l.card.A.plan} GDP ${l.d.gdp>0?'+':''}${l.d.gdp}%</div><div class="unsaid">AI가 말하지 않은 것: ${hidTxt||'없음'}</div>`:`<div class="d">GDP ${l.d.gdp>0?'+':''}${l.d.gdp||0}%${hidTxt?' · '+hidTxt:''}</div>`}</div></div>`}).join('')}</div></div>
    <button class="ghost" onclick="renderStart()">처음으로</button></div>`;
}
function nationCard(){
  SND.sfx('end');
  app.innerHTML = `<div class="screen">
    <span class="badge" style="justify-self:start">3차시 · 투표용 나라 카드 (이름 가림)</span>
    <h1>나라 ${String.fromCharCode(65+Math.floor(Math.random()*20))}</h1>
    <div class="ending"><small>이 나라의 결말</small><b>${endingOf(S).name}</b><small>${endingOf(S).sub}</small></div>
    <div class="box"><div class="in"><div class="lead">이 나라의 통치 이념</div><div style="font-size:18px;font-weight:700">“${esc(S.motto||'방향 없음')}”</div></div></div>
    <div class="land">${landSVG()}</div>
    <div class="box"><h3>국가소득 ${fmt(S.gdp)}조 원 <em>AI ${S.aiCount}번 · 정전 ${S.blackouts}번</em></h3><div class="in">${compareBars()}</div></div>
    <div class="box"><h3>가장 고민한 선택과 그 이유</h3><div class="in"><input type="text" id="refl" maxlength="200" placeholder="예: 데이터센터 유치를 거절했다. 냉각수 부족이 걱정됐다."></div></div>
    ${S.net ? `<button class="primary" id="submitcard">나라 카드 제출하기</button><div id="votewait"></div>` : `<p class="lead">실제 수업에서는 지도자 이름을 가린 채 이 카드가 친구들에게 공개되고, 1인 1표로 투표합니다.</p>`}
    <button class="ghost" onclick="saveDex(endingOf(S).id);renderStart()">처음으로</button></div>`;
  const sb = document.getElementById('submitcard');
  if (sb) sb.onclick = () => {
    netPush({done:true, reflection:document.getElementById('refl').value || '', motto:S.motto || ''});
    sb.disabled = true; sb.textContent = '제출했습니다';
    document.getElementById('votewait').innerHTML = '<div class="power">선생님이 투표를 열면 친구들의 나라 카드가 나옵니다…</div>';
    waitRoom('voting', renderVote);
  };
}
async function renderVote(){
  let cards = [];
  try { cards = await supaRpc('tk_cards', {p_code:S.net.code}); } catch(e){}
  const endName = id => (ENDINGS.find(e => e.id === id) || {name:'-'}).name;
  const bars = st => st ? STATS.map(x => `<span>${x.n} ${st[x.k]}</span>`).join(' · ') : '';
  app.innerHTML = `<div class="screen" style="max-width:900px">
    <span class="badge" style="justify-self:start">3차시 · 이름을 가린 나라 카드 투표</span>
    <h1>가장 좋은 나라에 한 표를</h1>
    <p class="lead">자기 나라에는 투표할 수 없습니다. 고른 까닭을 한 줄로 적어 주세요.</p>
    <div class="vcards">${cards.map(c => `<label class="vcard"><input type="radio" name="vt" value="${c.label}"><b>나라 ${c.label}</b>
      <span class="vm">“${esc(c.motto || '이념 없음')}”</span>
      <span class="vs">결말: ${esc(endName(c.ending))} · GDP ${fmt(Math.round(c.gdp))}조 · AI ${c.ai_count}번 · 숙청 ${c.purges}번</span>
      <span class="vs">${bars(c.st)}</span>
      ${c.reflection ? `<span class="vr">가장 고민한 선택: ${esc(c.reflection)}</span>` : ''}</label>`).join('') || '<p class="lead">아직 제출된 나라 카드가 없습니다.</p>'}</div>
    <input type="text" id="vreason" maxlength="200" placeholder="이 나라를 고른 까닭">
    <button class="primary" id="vgo">투표하기</button><div id="vmsg"></div></div>`;
  document.getElementById('vgo').onclick = async () => {
    const pick = document.querySelector('input[name=vt]:checked');
    const msg = document.getElementById('vmsg');
    if (!pick){ msg.innerHTML = '<div class="power bad">나라를 하나 골라 주세요.</div>'; return; }
    try {
      const r = await supaRpc('tk_vote', {p_id:S.net.id, p_secret:S.net.secret, p_label:pick.value, p_reason:document.getElementById('vreason').value || ''});
      msg.innerHTML = r.ok ? `<div class="power up">나라 ${pick.value}에 투표했습니다. 다시 고르면 바뀝니다.</div>` : `<div class="power bad">${esc(r.msg)}</div>`;
    } catch(e){ msg.innerHTML = '<div class="power bad">서버에 연결하지 못했습니다.</div>'; }
  };
}
renderStart();
</script>
