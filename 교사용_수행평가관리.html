<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수행평가 관리 (교사용)</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --line:#e2e4e9; --text:#1f2430; --sub:#6b7280;
    --accent:#3fae95; --accent2:#c99622; --danger:#c1544c; --mono:#1e1e2a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','맑은 고딕',sans-serif;background:var(--bg);color:var(--text);}
  .layout{display:flex;height:100vh;}
  .sidebar{width:300px;flex:none;background:var(--card);border-right:1px solid var(--line);
    overflow-y:auto;padding:16px 0;}
  .sidebar h1{font-size:16px;padding:0 16px 12px;margin:0;border-bottom:1px solid var(--line);}
  .chlist{padding:8px 0;}
  .chitem{padding:12px 16px 12px 26px;cursor:pointer;border-left:3px solid transparent;}
  .chitem:hover{background:#f0f1f4;}
  .chitem.active{background:#eefaf6;border-left-color:var(--accent);}
  .chitem .chid{font-size:11px;color:var(--sub);}
  .chitem .chtitle{font-size:14.5px;font-weight:600;margin-top:2px;}
  .chitem .chmeta{font-size:12px;color:var(--sub);margin-top:4px;}
  .deptgroup{border-bottom:1px solid var(--line);}
  .depthead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
    background:#f7f8fa;cursor:pointer;font-size:13px;font-weight:700;color:var(--text);}
  .depthead:hover{background:#eef0f3;}
  .depthead .deptadd{font-size:11.5px;color:var(--accent);font-weight:700;}
  .deptchapters{padding:2px 0;}
  .tmodal{position:fixed;inset:0;background:rgba(30,30,40,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .tmodalcard{background:var(--card);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;
    padding:22px 22px 20px;position:relative;}
  .tmodalclose{position:absolute;top:12px;right:12px;border:none;background:#eceef1;color:var(--sub);
    border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;}
  .tmodalclose:hover{background:#e2e4e9;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;}
  .topbar h2{font-size:16px;margin:0;flex:1;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;}
  .btn-save{background:var(--accent);color:#fff;}
  .btn-save:hover{filter:brightness(1.05);}
  .btn-reload{background:#eceef1;color:var(--text);}
  .btn-reload:hover{background:#e2e4e9;}
  .status{font-size:13px;padding:4px 10px;border-radius:6px;}
  .status.ok{background:#eafaf3;color:var(--accent);}
  .status.err{background:#fdeeee;color:var(--danger);}
  .status.info{background:#f0f1f4;color:var(--sub);}
  .editorwrap{flex:1;overflow:auto;padding:18px 20px;}
  .metabar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .metabar .field{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px;flex:1;}
  .metabar .field.wide{flex:2 1 320px;}
  .metabar label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;}
  .metabar input, .metabar textarea{border:none;font-size:14px;width:100%;outline:none;background:transparent;color:var(--text);font-family:inherit;resize:vertical;}
  .hint{font-size:12.5px;color:var(--sub);margin:0 0 16px;line-height:1.6;background:#fbf7ec;border:1px solid #eee0bd;border-radius:8px;padding:10px 14px;}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:14px;}

  .roundcard{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;}
  .roundhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f7f8fa;border-bottom:1px solid var(--line);}
  .roundhead .rnum{font-size:12px;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;font-weight:700;flex:none;}
  .roundhead .rkind{font-size:11px;color:var(--sub);background:#eceef1;border-radius:6px;padding:2px 8px;flex:none;}
  .roundhead .rtitle{flex:1;border:none;background:transparent;font-size:14.5px;font-weight:600;outline:none;color:var(--text);}
  .roundbody{padding:16px;}
  .flabel{font-size:12px;color:var(--sub);font-weight:600;margin:0 0 4px;}
  .ftext{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--text);}
  .ftext:focus{border-color:var(--accent);}
  textarea.ftext{resize:vertical;min-height:44px;line-height:1.5;}
  .fgroup{margin-bottom:14px;}
  .row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
  .row .ftext{flex:1;}
  .rmbtn{flex:none;border:none;background:#fdeeee;color:var(--danger);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:14px;}
  .rmbtn:hover{background:#fadada;}
  .addbtn{border:1px dashed var(--line);background:transparent;color:var(--sub);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;margin-top:2px;}
  .addbtn:hover{border-color:var(--accent);color:var(--accent);}
  select.ftext{cursor:pointer;}
  .pairrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .pairrow .ftext{flex:1;}
  .pairrow .arrow{flex:none;color:var(--sub);font-size:13px;}
  .optrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .optrow input[type=radio]{flex:none;width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
  .optrow .ftext{flex:1;}
  .stmtrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .stmtrow .tag{flex:none;width:22px;text-align:center;font-weight:700;color:var(--accent2);}
  .comborow{display:flex;gap:10px;align-items:center;margin-bottom:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
  .comborow input[type=radio]{flex:none;width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
  .comborow .chips{flex:1;display:flex;gap:12px;flex-wrap:wrap;}
  .comborow label{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;}
  .rowlabel{font-size:12px;color:var(--sub);margin-right:4px;}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  details.adv{margin-top:6px;}
  details.adv summary{cursor:pointer;font-size:13px;color:var(--sub);padding:8px 0;}
  details.adv textarea{width:100%;min-height:160px;font-family:'D2Coding','Consolas',monospace;font-size:13px;
    background:var(--mono);color:#e6e6ef;border:1px solid #33334a;border-radius:10px;padding:12px;margin-top:6px;}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h1>📋 수행평가 관리</h1>
    <div class="chitem" id="item-students" style="border-bottom:1px solid var(--line)">
      <div class="chtitle">👤 학생 계정 관리</div>
      <div class="chmeta">로그인 아이디·비밀번호 초기화 현황</div>
    </div>
    <div class="chitem" id="item-depts" style="border-bottom:1px solid var(--line)">
      <div class="chtitle">🏢 연구동 공개 설정</div>
      <div class="chmeta">연구동 열기/닫기·마감일 설정</div>
    </div>
    <div class="chitem" id="item-board" style="border-bottom:1px solid var(--line)">
      <div class="chtitle">💬 오류신고 / Q&A</div>
      <div class="chmeta">학생이 남긴 글 확인·답변</div>
    </div>
    <div style="padding:10px 16px;border-bottom:1px solid var(--line)">
      <a href="제출기록_미리보기.html" target="_blank" style="font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600">📊 제출기록 미리보기 (테스트용) →</a>
    </div>
    <div class="chlist" id="chlist"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="curTitle">단원을 선택하세요</h2>
      <span class="status info" id="statusMsg"></span>
      <button class="btn btn-reload" id="reloadBtn" style="display:none">↻ 다시 불러오기</button>
      <button class="btn btn-save" id="saveBtn" style="display:none">💾 저장 (학생 화면에 즉시 반영)</button>
    </div>
    <div class="editorwrap" id="editorwrap">
      <div class="empty">왼쪽에서 단원을 선택하면 이 단원의 문제 내용을 편집할 수 있습니다.</div>
    </div>
  </div>
</div>
<div id="teacherModalHost"></div>
<script>
const CHAPTERS = [
  {file:'ch10.json', label:'10단원'}, {file:'ch11.json', label:'11단원'},
  {file:'ch12.json', label:'12단원'}, {file:'ch13.json', label:'13단원'},
  {file:'ch14.json', label:'14단원'}, {file:'ch15.json', label:'15단원'},
  {file:'ch16.json', label:'16단원'}, {file:'ch17.json', label:'17단원'},
  {file:'ch18.json', label:'18단원'}, {file:'ch19.json', label:'19단원'},
  {file:'ch20.json', label:'20단원(물질변화와 에너지의 출입)'}, {file:'ch21.json', label:'21단원(화학 기출문제 풀기)'},];

const KIND_LABEL = {classify:'분류형', matchpairs:'짝짓기형', ordering:'순서형',
  quiz:'객관식', graphread:'그래프판독', combo:'보기조합형', opinion:'서술형'};
const TAGS = ['ㄱ','ㄴ','ㄷ','ㄹ'];

let curFile = null;
let curSeedKey = null;
let curVars = null;         // 원본 vars(고급 설정, 그대로 보존)
let curMeta = {};
let curExtra = {};          // seedKey/vars/meta/rounds 외 나머지 필드(gradablePool 등)를 저장 시 안 날아가게 그대로 보존
let workingRounds = [];      // 편집 중인 라운드 배열(폼과 실시간 동기화)
let workingPool = [];        // 편집 중인 "문제 풀"(gradablePool) 배열 — 있는 단원만 사용
let curGradablePoolCount = 6; // 학생마다 문제 풀에서 몇 개를 뽑을지

function setStatus(msg, cls){
  const el = document.getElementById('statusMsg');
  el.textContent = msg; el.className = 'status ' + (cls||'info');
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }

/* ---------- 단원 목록 (연구동별로 묶어서 표시) ---------- */
function chapterNumOf(file){ return +(file.match(/ch(\d+)/)[1]); }
function chapterItemHtml(c){
  return `<div class="chitem" data-file="${c.file}" id="item-${c.file}">
    <div class="chid">${c.label}</div>
    <div class="chtitle">불러오는 중...</div>
    <div class="chmeta"></div>
  </div>`;
}
function renderSidebarGroups(depts){
  const listEl = document.getElementById('chlist');
  const byNum = {};
  CHAPTERS.forEach(c=>{ byNum[chapterNumOf(c.file)] = c; });
  const used = new Set();
  let html = '';
  depts.forEach(d=>{
    html += `<div class="deptgroup">
      <div class="depthead" data-dept="${escAttr(d.id)}" data-deptname="${escAttr(d.name)}">
        <span>🏢 ${esc(d.name)}</span><span class="deptadd">+ 단원 추가</span>
      </div>
      <div class="deptchapters">`;
    (d.chapters||[]).forEach(n=>{
      const c = byNum[n];
      if(!c) return;
      used.add(n);
      html += chapterItemHtml(c);
    });
    html += `</div></div>`;
  });
  const orphans = CHAPTERS.filter(c=>!used.has(chapterNumOf(c.file)));
  if(orphans.length){
    html += `<div class="deptgroup">
      <div class="depthead" style="cursor:default"><span>📎 미분류 단원</span></div>
      <div class="deptchapters">${orphans.map(chapterItemHtml).join('')}</div>
    </div>`;
  }
  listEl.innerHTML = html;
  listEl.querySelectorAll('.depthead[data-dept]').forEach(el=>{
    el.addEventListener('click', ()=>selectDeptAdd(el.dataset.dept, el.dataset.deptname));
  });
}
async function loadChapterList(){
  let depts = [];
  try{
    const r = await fetch('/api/deptchapters', {cache:'no-store'});
    depts = await r.json();
  }catch(e){ /* 실패해도 아래에서 미분류로 전부 뜸 */ }
  renderSidebarGroups(depts);
  for(const c of CHAPTERS){
    const el = document.getElementById('item-'+c.file);
    if(!el) continue;
    try{
      const res = await fetch('data/'+c.file, {cache:'no-store'});
      const data = await res.json();
      const gradable = data.rounds.filter(r=>r.kind!=='opinion').length;
      const opinionN = data.rounds.length - gradable;
      el.querySelector('.chtitle').textContent = data.meta.title;
      el.querySelector('.chmeta').textContent = `문제 ${gradable} · 서술 ${opinionN} · 목표 ${data.meta.targetMin}분`;
      el.addEventListener('click', ()=>selectChapter(c.file));
    }catch(e){
      el.querySelector('.chtitle').textContent = '(불러오기 실패)';
    }
  }
}

/* ---------- 🏢 연구동 클릭 → 새 단원 추가 ---------- */
function selectDeptAdd(deptId, deptName){
  curFile = null;
  document.querySelectorAll('.chitem').forEach(el=>el.classList.remove('active'));
  document.getElementById('item-students').classList.remove('active');
  document.getElementById('item-depts').classList.remove('active');
  document.getElementById('curTitle').textContent = `🏢 ${deptName} — 새 단원 추가`;
  document.getElementById('reloadBtn').style.display = 'none';
  document.getElementById('saveBtn').style.display = 'none';
  setStatus('', 'info');

  const usedNums = CHAPTERS.map(c=>chapterNumOf(c.file));
  const nextNum = Math.max(0, ...usedNums) + 1;

  const wrap = document.getElementById('editorwrap');
  wrap.innerHTML = `
    <div class="hint">이 연구동(<b>${esc(deptName)}</b>)에 새 단원(문제 세트)을 추가합니다. 만들면 왼쪽 목록과
      학생 로비에 바로 나타나고, 그 다음 이 화면에서 문제를 채워 넣을 수 있어요 (처음엔 예시 서술형 문제 1개만 들어있어요).</div>
    <div class="roundcard"><div class="roundbody">
      <div class="fgroup"><div class="flabel">단원 번호</div><input class="ftext" id="newChNum" type="number" value="${nextNum}"></div>
      <div class="fgroup"><div class="flabel">단원 제목</div><input class="ftext" id="newChTitle" placeholder="예) 우주의 물질과 원소의 생성"></div>
      <div class="fgroup"><div class="flabel">파일 이름용 슬러그(띄어쓰기 없이)</div><input class="ftext" id="newChSlug" placeholder="예) 우주의물질과원소의생성"></div>
      <div class="fgroup"><div class="flabel">로비 카드 소제목</div><input class="ftext" id="newChCp" placeholder="예) 원소의 기원"></div>
      <div class="fgroup"><div class="flabel">목표 시간(분)</div><input class="ftext" id="newChMin" type="number" value="20"></div>
      <div class="fgroup"><div class="flabel">과목 계열(연구소 강화 화면 분류용)</div>
        <select class="ftext" id="newChMj">
          <option value="earth">지구과학</option><option value="bio">생명과학</option>
          <option value="chem">화학</option><option value="phys">물리학</option><option value="etc">기타</option>
        </select>
      </div>
      <button class="btn btn-save" id="createChBtn">+ 단원 만들기</button>
      <span class="status info" id="newChStatus" style="margin-left:10px"></span>
    </div></div>
  `;
  document.getElementById('createChBtn').addEventListener('click', async ()=>{
    const statusEl = document.getElementById('newChStatus');
    const num = document.getElementById('newChNum').value.trim();
    const title = document.getElementById('newChTitle').value.trim();
    const slug = document.getElementById('newChSlug').value.trim();
    const cp = document.getElementById('newChCp').value.trim();
    const targetMin = document.getElementById('newChMin').value.trim();
    const mj = document.getElementById('newChMj').value;
    if(!title || !slug){ statusEl.textContent = '단원 제목과 슬러그를 입력하세요.'; statusEl.className = 'status err'; return; }
    statusEl.textContent = '만드는 중...'; statusEl.className = 'status info';
    try{
      const res = await fetch('/api/newchapter', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({deptId, num, title, slug, cp, mj, targetMin})});
      const out = await res.json();
      if(!out.ok){ statusEl.textContent = '실패: '+(out.error||'알 수 없는 오류'); statusEl.className = 'status err'; return; }
      statusEl.textContent = '만들어졌어요!' + (out.warnings && out.warnings.length ? ' ('+out.warnings.join(' / ')+')' : '');
      statusEl.className = 'status ok';
      CHAPTERS.push({file:`ch${out.num}.json`, label:`${out.num}단원(${title})`});
      await loadChapterList();
      selectChapter(`ch${out.num}.json`);
    }catch(e){
      statusEl.textContent = '실패(서버 연결 오류): '+e.message; statusEl.className = 'status err';
    }
  });
}

async function selectChapter(file){
  curFile = file;
  document.querySelectorAll('.chitem').forEach(el=>el.classList.toggle('active', el.dataset.file===file));
  setStatus('불러오는 중...', 'info');
  try{
    const res = await fetch('data/'+file, {cache:'no-store'});
    const data = await res.json();
    curSeedKey = data.seedKey;
    curVars = data.vars;
    curMeta = data.meta;
    curExtra = {...data};
    delete curExtra.seedKey; delete curExtra.vars; delete curExtra.meta; delete curExtra.rounds;
    delete curExtra.gradablePool; delete curExtra.gradablePoolCount;
    workingRounds = normalizeRoundsForEdit(data.rounds);
    workingPool = normalizeRoundsForEdit(Array.isArray(data.gradablePool) ? data.gradablePool : []);
    curGradablePoolCount = data.gradablePoolCount || 6;
    renderAll();
    setStatus('불러옴', 'ok');
  }catch(e){
    setStatus('불러오기 실패: '+e.message, 'err');
  }
}

/* ---------- 👤 학생 계정 관리 ---------- */
/* ---------- 🏢 연구동 공개 설정 ---------- */
const DEPT_META=[
  {id:'d1',n:'고생물 연구동',u:'Ⅰ-1. 환경 변화와 생물 다양성'},
  {id:'d2',n:'물질 변환동',u:'Ⅰ-2. 우리 주변의 변화'},
  {id:'d3',n:'생태 관측동',u:'Ⅱ-1. 생태계와 환경'},
  {id:'d4',n:'에너지 발전동',u:'Ⅱ-2. 에너지'},
  {id:'d5',n:'데이터 분석동',u:'Ⅲ-1. 과학의 유용성과 빅데이터'},
  {id:'d6',n:'미래기술 윤리동',u:'Ⅲ-2. 과학기술의 발전과 윤리'}
];
function selectDepts(){
  curFile = null;
  document.querySelectorAll('.chitem').forEach(el=>el.classList.remove('active'));
  document.getElementById('item-depts').classList.add('active');
  document.getElementById('curTitle').textContent = '🏢 연구동 공개 설정';
  document.getElementById('reloadBtn').style.display = 'none';
  document.getElementById('saveBtn').style.display = 'none';
  setStatus('', 'info');

  const wrap = document.getElementById('editorwrap');
  wrap.innerHTML = `
    <div class="hint">
      학생 로비(05_프로토타입.html)에서 각 연구동이 열려 있는지, 마감일이 언제인지 정합니다. 여기서 끄면
      학생 화면에 "🔒 잠김"으로 표시되고, 마감일을 넣으면 로비에 남은 기한이 함께 보여요(마감일이 지나도

function parseRoster(text){
  return text.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const parts = line.split(/[,\t]/).map(s=>s.trim());
    let name = parts[0]||'', studentId = parts[1]||'';
    // 학번이 학년+반+번호(5자리) 형식이면 아이디를 "이름+반"으로 자동 구성한다(이미 숫자로 끝나면 건드리지 않음)
    if(/^\d{5}$/.test(studentId) && name && !/\d$/.test(name)){
      name = name + (+studentId.slice(1,3));
    }
    return { name, studentId };
  }).filter(s=>s.name && s.studentId);
}
function setRosterStatus(msg, cls){
  const el = document.getElementById('rosterStatus');
  if(!el) return;
  el.textContent = msg; el.className = 'status ' + (cls||'info');
}

  const students = parseRoster(document.getElementById('rosterInput').value);
  if(!students.length){ setRosterStatus('등록할 학생이 없습니다. "이름,학번" 형식으로 입력하세요.', 'err'); return; }
  setRosterStatus('등록 중...', 'info');
  try{
    const res = await fetch('/api/roster', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({students}) });
    const out = await res.json();
    if(out.ok){
      setRosterStatus(`등록 완료 — 새로 추가 ${out.added}명, 이미 있어서 건너뜀 ${out.skipped}명 (전체 ${out.total}명)`, 'ok');
      document.getElementById('rosterInput').value='';
      loadRoster();
    } else setRosterStatus('등록 실패: '+(out.error||'알 수 없는 오류'), 'err');
  }catch(e){ setRosterStatus('등록 실패(서버 연결 오류): '+e.message, 'err'); }
}

const _chapterPromptCache = {};
async function chapterPromptMap(chapterId){
  if(_chapterPromptCache[chapterId]) return _chapterPromptCache[chapterId];
  const m = String(chapterId||'').match(/^ch(\d+)/);
  if(!m) return {};
  try{
    const res = await fetch('data/ch'+m[1]+'.json', {cache:'no-store'});
    const data = await res.json();
    const map = {};
    data.rounds.forEach(r=>{ map[r.id] = { title:r.title, prompt:r.prompt }; });
    _chapterPromptCache[chapterId] = map;
    return map;
  }catch(e){ return {}; }
}

function redoKey(chapterId, roundId){ return chapterId+'::'+roundId; }

      fetch('/api/mock-submissions', {cache:'no-store'}),

      fetch('/api/redo-requests?student='+encodeURIComponent(name), {cache:'no-store'})
    ]);
    const all = await subRes.json();
    const journalList = await journalRes.json();
    const redoList = await redoRes.json();
    const journalMap = {}; journalList.forEach(j=>{ journalMap[redoKey(j.chapter_id, j.round_id)] = j; });
    const redoMap = {}; redoList.forEach(r=>{ redoMap[redoKey(r.chapter_id, r.round_id)] = r; });

    if(!mine.length){ target.textContent = '아직 제출한 과제가 없어요.'; return; }
    let html = '';

/* ---------- 라운드 데이터 ↔ 편집용 형태 변환 ---------- */
function normalizeRoundsForEdit(rounds){
  return rounds.map(r=>{
    const c = JSON.parse(JSON.stringify(r));
    if(c.kind==='matchpairs'){
      c._pairs = c.left.map(l=>{
        const rightId = c.correct[l.id];
        const right = c.right.find(x=>x.id===rightId);
        return {left:l.content, right: right? right.content : ''};
      });
    }
    if(c.kind==='quiz' || c.kind==='graphread'){
      if(c.correctValue!==undefined){
        c._usesValue = true;
        c._correctIdx = c.options.findIndex(o=>o===c.correctValue);
      } else {
        c._usesValue = false;
        c._correctIdx = c.correctIndex;
      }
      if(c._correctIdx < 0) c._correctIdx = 0;
    }
    return c;
  });
}
function denormalizeRound(c){
  const out = JSON.parse(JSON.stringify(c));
  if(out.kind==='matchpairs'){
    const pairs = out._pairs || [];
    out.left = pairs.map((p,i)=>({id:'l'+(i+1), content:p.left}));
    out.right = pairs.map((p,i)=>({id:'r'+(i+1), content:p.right}));
    out.correct = {}; pairs.forEach((p,i)=>{ out.correct['l'+(i+1)] = 'r'+(i+1); });
    delete out._pairs;
  }
  if(out.kind==='quiz' || out.kind==='graphread'){
    if(out._usesValue){ out.correctValue = out.options[out._correctIdx]; delete out.correctIndex; }
    else { out.correctIndex = out._correctIdx; delete out.correctValue; }
    delete out._usesValue; delete out._correctIdx;
  }
  return out;
}

/* ---------- 새 문제(라운드) 기본값 ---------- */
function createDefaultRound(kind){
  const base = { id: uid('r'), kind, title: '새 문제', prompt: '▶ ' };
  if(kind==='classify') return Object.assign(base, {
    items: [{id:uid('c'), content:'', correct:'카테고리1'}],
    categories: ['카테고리1','카테고리2'], passRatio: 0.8
  });
  if(kind==='matchpairs') return Object.assign(base, {
    left: [{id:'l1', content:''}], right: [{id:'r1', content:''}], correct: {l1:'r1'}
  });
  if(kind==='ordering') return Object.assign(base, {
    items: [{id:uid('s'), content:'', rank:1}, {id:uid('s'), content:'', rank:2}]
  });
  if(kind==='quiz' || kind==='graphread') return Object.assign(base, {
    question: '', options: ['','','',''], correctIndex: 0
  });
  if(kind==='combo') return Object.assign(base, {
    statements: ['', ''], comboOptions: [[0],[1],[0,1]], correctComboIndex: 0
  });
  if(kind==='opinion') return Object.assign(base, { placeholder: '', minLen: 20 });
  return base;
}

function scopeOf(el){ return el.closest('[data-scope="pool"]') ? 'pool' : 'rounds'; }
function arrOf(scope){ return scope==='pool' ? workingPool : workingRounds; }
function cardPrefix(scope){ return scope==='pool' ? 'pool-round-' : 'round-'; }

function rerenderRound(scope, idx){
  const arr = arrOf(scope);
  const card = document.getElementById(cardPrefix(scope)+idx);
  if(card) card.innerHTML = roundCardHtml(arr[idx], idx, arr.length);
}

/* ---------- 라운드 카드 HTML ---------- */
function roundCardHtml(r, idx, total){
  if(total===undefined) total = workingRounds.length;
  const head = `
    <div class="roundhead">
      <span class="rnum">${idx+1}</span>
      <span class="rkind">${KIND_LABEL[r.kind]||r.kind}</span>
      <input class="rtitle" data-r="${idx}" data-field="title" value="${escAttr(r.title||'')}">
      <button class="rmbtn" data-action="round-up" data-r="${idx}" title="순서 위로" ${idx===0?'disabled style="opacity:.3"':''}>↑</button>
      <button class="rmbtn" data-action="round-down" data-r="${idx}" title="순서 아래로" ${idx===total-1?'disabled style="opacity:.3"':''}>↓</button>
      <button class="rmbtn" data-action="rm-round" data-r="${idx}" title="이 문제 삭제">🗑</button>
    </div>`;
  let body = `<div class="roundbody">`;
  body += fieldBlock('문제 안내(▶)', 'textarea', idx, 'prompt', r.prompt);
  if(r.kind==='quiz' || r.kind==='graphread') body += fieldBlock('질문', 'text', idx, 'question', r.question);
  body += kindBodyHtml(r, idx);
  body += `</div>`;
  return head + body;
}
function fieldBlock(label, type, idx, field, value){
  const id = `f_${idx}_${field}`;
  if(type==='textarea'){
    return `<div class="fgroup"><div class="flabel">${label}</div>
      <textarea class="ftext fieldinput" data-r="${idx}" data-field="${field}" rows="2">${esc(value)}</textarea></div>`;
  }
  return `<div class="fgroup"><div class="flabel">${label}</div>
    <input class="ftext fieldinput" data-r="${idx}" data-field="${field}" value="${escAttr(value)}"></div>`;
}

function kindBodyHtml(r, idx){
  if(r.kind==='classify') return classifyHtml(r, idx);
  if(r.kind==='matchpairs') return matchpairsHtml(r, idx);
  if(r.kind==='ordering') return orderingHtml(r, idx);
  if(r.kind==='quiz' || r.kind==='graphread') return quizHtml(r, idx);
  if(r.kind==='combo') return comboHtml(r, idx);
  if(r.kind==='opinion') return opinionHtml(r, idx);
  return '';
}

function itemsVarNotice(r){
  return `<div class="hint" style="background:#fff3d6;border-color:#edd49a;color:#7a5c1c">
    ⚠️ 이 라운드는 무작위 변수(<code>${escAttr(r.itemsVar)}</code>)에서 항목을 뽑아 써요 — 학생마다 다른 조합이 나옵니다.
    이 화면에서는 항목을 직접 편집할 수 없어요. 고치려면 아래 "⚙️ 고급 설정 — 무작위 변수(vars) 직접 편집"에서
    원본 JSON을 직접 수정해주세요.</div>`;
}
function classifyHtml(r, idx){
  let h = `<div class="fgroup"><div class="flabel">분류 카테고리</div>`;
  r.categories.forEach((cat,ci)=>{
    h += `<div class="row">
      <input class="ftext catinput" data-r="${idx}" data-ci="${ci}" value="${escAttr(cat)}">
      <button class="rmbtn" data-action="rm-category" data-r="${idx}" data-ci="${ci}">×</button>
    </div>`;
  });
  h += `<button class="addbtn" data-action="add-category" data-r="${idx}">+ 카테고리 추가</button></div>`;

  if(r.itemsVar){
    h += itemsVarNotice(r);
  } else {
    h += `<div class="fgroup"><div class="flabel">항목 (문구 → 정답 카테고리)</div>`;
    r.items.forEach((it,ii)=>{
      h += `<div class="row">
        <textarea class="ftext itemcontent" rows="1" data-r="${idx}" data-ii="${ii}">${esc(it.content)}</textarea>
        <select class="ftext itemcorrect" data-r="${idx}" data-ii="${ii}">
          ${r.categories.map(cat=>`<option value="${escAttr(cat)}" ${it.correct===cat?'selected':''}>${esc(cat)}</option>`).join('')}
        </select>
        <button class="rmbtn" data-action="rm-item" data-r="${idx}" data-ii="${ii}">×</button>
      </div>`;
    });
    h += `<button class="addbtn" data-action="add-item" data-r="${idx}">+ 항목 추가</button></div>`;
  }

  h += `<div class="fgroup twocol">
    <div><div class="flabel">통과 정답 비율(%) — 비워두면 80%</div>
      <input class="ftext fieldinput" data-r="${idx}" data-field="passRatioPct" type="number" min="0" max="100"
        value="${Math.round((r.passRatio!=null?r.passRatio:0.8)*100)}"></div>
  </div>`;
  return h;
}

function matchpairsHtml(r, idx){
  let h = `<div class="fgroup"><div class="flabel">짝 연결 (왼쪽 ↔ 오른쪽)</div>`;
  (r._pairs||[]).forEach((p,pi)=>{
    h += `<div class="pairrow">
      <textarea class="ftext pairleft" rows="1" data-r="${idx}" data-pi="${pi}">${esc(p.left)}</textarea>
      <span class="arrow">↔</span>
      <textarea class="ftext pairright" rows="1" data-r="${idx}" data-pi="${pi}">${esc(p.right)}</textarea>
      <button class="rmbtn" data-action="rm-pair" data-r="${idx}" data-pi="${pi}">×</button>
    </div>`;
  });
  h += `<button class="addbtn" data-action="add-pair" data-r="${idx}">+ 짝 추가</button></div>`;
  return h;
}

function orderingHtml(r, idx){
  if(r.itemsVar) return itemsVarNotice(r);
  const items = [...r.items].sort((a,b)=>a.rank-b.rank);
  let h = `<div class="fgroup"><div class="flabel">순서대로 나열 (위 = 1번째)</div>`;
  items.forEach((it,ii)=>{
    h += `<div class="row">
      <span class="rowlabel">${ii+1}.</span>
      <textarea class="ftext orderitem" rows="1" data-r="${idx}" data-ii="${ii}">${esc(it.content)}</textarea>
      <button class="rmbtn" data-action="order-up" data-r="${idx}" data-ii="${ii}" title="위로" ${ii===0?'disabled style="opacity:.3"':''}>↑</button>
      <button class="rmbtn" data-action="order-down" data-r="${idx}" data-ii="${ii}" title="아래로" ${ii===items.length-1?'disabled style="opacity:.3"':''}>↓</button>
      <button class="rmbtn" data-action="rm-orderitem" data-r="${idx}" data-ii="${ii}">×</button>
    </div>`;
  });
  h += `<button class="addbtn" data-action="add-orderitem" data-r="${idx}">+ 항목 추가</button></div>`;
  return h;
}

function quizHtml(r, idx){
  let h = `<div class="fgroup"><div class="flabel">보기 (왼쪽 동그라미 = 정답)</div>`;
  if(r._usesValue){
    h += `<div class="hint" style="margin-bottom:10px">이 문제는 무작위 계산값과 연동된 정답입니다. 정답으로 표시된 보기의 문구(예: <code>{{efficiency}}%</code>)는 그대로 유지해야 정답 판정이 정확합니다.</div>`;
  }
  r.options.forEach((op,oi)=>{
    h += `<div class="optrow">
      <input type="radio" name="correct_${idx}" data-action="set-correct" data-r="${idx}" data-oi="${oi}" ${r._correctIdx===oi?'checked':''}>
      <input class="ftext optinput" data-r="${idx}" data-oi="${oi}" value="${escAttr(op)}">
      <button class="rmbtn" data-action="rm-option" data-r="${idx}" data-oi="${oi}">×</button>
    </div>`;
  });
  h += `<button class="addbtn" data-action="add-option" data-r="${idx}">+ 보기 추가</button></div>`;
  return h;
}

function comboHtml(r, idx){
  let h = `<div class="fgroup"><div class="flabel">보기 문장 (ㄱㄴㄷㄹ)</div>`;
  r.statements.forEach((s,si)=>{
    h += `<div class="stmtrow">
      <span class="tag">${TAGS[si]||('#'+(si+1))}</span>
      <textarea class="ftext stmtinput" rows="1" data-r="${idx}" data-si="${si}">${esc(s)}</textarea>
      <button class="rmbtn" data-action="rm-statement" data-r="${idx}" data-si="${si}" ${r.statements.length<=1?'disabled style="opacity:.3"':''}>×</button>
    </div>`;
  });
  if(r.statements.length < TAGS.length){
    h += `<button class="addbtn" data-action="add-statement" data-r="${idx}">+ 문장 추가</button>`;
  }
  h += `</div>`;

  h += `<div class="fgroup"><div class="flabel">조합 선택지 (왼쪽 동그라미 = 정답 조합)</div>`;
  r.comboOptions.forEach((combo,ci)=>{
    h += `<div class="comborow">
      <input type="radio" name="combocorrect_${idx}" data-action="set-combocorrect" data-r="${idx}" data-ci="${ci}" ${r.correctComboIndex===ci?'checked':''}>
      <div class="chips">${r.statements.map((s,si)=>`
        <label><input type="checkbox" data-action="toggle-combo-idx" data-r="${idx}" data-ci="${ci}" data-si="${si}" ${combo.includes(si)?'checked':''}> ${TAGS[si]||('#'+(si+1))}</label>
      `).join('')}</div>
      <button class="rmbtn" data-action="rm-combo" data-r="${idx}" data-ci="${ci}" ${r.comboOptions.length<=2?'disabled style="opacity:.3"':''}>×</button>
    </div>`;
  });
  h += `<button class="addbtn" data-action="add-combo" data-r="${idx}">+ 조합 추가</button></div>`;
  return h;
}

function opinionHtml(r, idx){
  let h = fieldBlock('입력칸 예시(placeholder)', 'text', idx, 'placeholder', r.placeholder||'');
  h += `<div class="fgroup"><div class="flabel">최소 글자수</div>
    <input class="ftext fieldinput" data-r="${idx}" data-field="minLen" type="number" min="0" value="${r.minLen||20}"></div>`;

}

/* ---------- 이벤트 바인딩 (위임) ---------- */
function bindGlobalEvents(){
  const wrap = document.getElementById('editorwrap');
  wrap.oninput = onInput;
  wrap.onchange = onChange;
  wrap.onclick = onClick;
}

function onInput(e){
  const t = e.target;
  const rIdx = t.dataset.r!==undefined ? +t.dataset.r : null;
  if(t.id==='poolCountInput') return; // 자체 리스너에서 처리
  const arr = arrOf(scopeOf(t));

  if(t.classList.contains('metafield')){ setStatus('수정됨 (저장 필요)', 'info'); return; }
  if(t.classList.contains('rtitle')){ arr[rIdx].title = t.value; }
  else if(t.classList.contains('fieldinput')){
    const f = t.dataset.field;
    arr[rIdx][f] = (t.type==='number') ? (+t.value||0) : t.value;
    if(f==='passRatioPct'){ arr[rIdx].passRatio = Math.max(0,Math.min(100,+t.value||0))/100; }
  }
  else if(t.classList.contains('catinput')){ arr[rIdx].categories[+t.dataset.ci] = t.value; }
  else if(t.classList.contains('itemcontent')){ arr[rIdx].items[+t.dataset.ii].content = t.value; }
  else if(t.classList.contains('pairleft')){ arr[rIdx]._pairs[+t.dataset.pi].left = t.value; }
  else if(t.classList.contains('pairright')){ arr[rIdx]._pairs[+t.dataset.pi].right = t.value; }
  else if(t.classList.contains('orderitem')){ syncOrderItem(arr, rIdx, +t.dataset.ii, t.value); }
  else if(t.classList.contains('optinput')){ arr[rIdx].options[+t.dataset.oi] = t.value; }
  else if(t.classList.contains('stmtinput')){ arr[rIdx].statements[+t.dataset.si] = t.value; }
  else return;
  setStatus('수정됨 (저장 필요)', 'info');
}

function syncOrderItem(arr, rIdx, sortedPos, value){
  const r = arr[rIdx];
  const items = [...r.items].sort((a,b)=>a.rank-b.rank);
  items[sortedPos].content = value; // items 배열은 참조 공유이므로 원본도 갱신됨
}

function onChange(e){
  const t = e.target;
  const rIdx = t.dataset.r!==undefined ? +t.dataset.r : null;
  const scope = scopeOf(t);
  const arr = arrOf(scope);
  if(t.classList.contains('catinput')){
    // 카테고리 이름이 바뀌면, 그 이름을 정답으로 쓰던 항목도 같이 갱신
    const ci = +t.dataset.ci;
    const oldVal = t.dataset.prevVal;
    const newVal = t.value;
    const r = arr[rIdx];
    if(oldVal!==undefined && oldVal!==newVal){
      r.items.forEach(it=>{ if(it.correct===oldVal) it.correct=newVal; });
    }
    rerenderRound(scope, rIdx);
    setStatus('수정됨 (저장 필요)', 'info');
    return;
  }
  if(t.classList.contains('itemcorrect')){
    arr[rIdx].items[+t.dataset.ii].correct = t.value;
    setStatus('수정됨 (저장 필요)', 'info');
  }
}

// 카테고리 인풋 focus 시 이전 값을 저장해두어 change 때 비교할 수 있게 함
document.addEventListener('focusin', e=>{
  if(e.target.classList && e.target.classList.contains('catinput')) e.target.dataset.prevVal = e.target.value;
});

function onClick(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const rIdx = btn.dataset.r!==undefined ? +btn.dataset.r : null;
  const scope = scopeOf(btn);
  const arr = arrOf(scope);
  const r = rIdx!==null ? arr[rIdx] : null;

  if(action==='rm-round'){
    if(arr.length<=1){ alert('문제를 최소 1개는 남겨둬야 해요.'); return; }
    if(!confirm(`"${r.title||'이 문제'}"를 삭제할까요? 저장하기 전까지는 되돌릴 수 있어요(저장 전 새로고침).`)) return;
    arr.splice(rIdx,1);
    renderAll();
    setStatus('문제를 삭제했어요 (저장 필요)', 'info');
    return;
  }

  if(action==='round-up' || action==='round-down'){
    const j = action==='round-up' ? rIdx-1 : rIdx+1;
    if(j<0 || j>=arr.length) return;
    const tmp = arr[rIdx]; arr[rIdx] = arr[j]; arr[j] = tmp;
    renderAll();
    setStatus('문제 순서를 바꿨어요 (저장 필요)', 'info');
    return;
  }

  if(action==='add-category'){ r.categories.push('새 카테고리'); }
  else if(action==='rm-category'){
    const ci = +btn.dataset.ci; const removed = r.categories[ci];
    if(r.categories.length<=1) return;
    r.categories.splice(ci,1);
    r.items.forEach(it=>{ if(it.correct===removed) it.correct = r.categories[0]; });
  }
  else if(action==='add-item'){ r.items.push({id: uid('c'), content:'새 항목', correct: r.categories[0]}); }
  else if(action==='rm-item'){ r.items.splice(+btn.dataset.ii,1); }
  else if(action==='add-pair'){ r._pairs.push({left:'', right:''}); }
  else if(action==='rm-pair'){
    if(r._pairs.length<=1) return;
    r._pairs.splice(+btn.dataset.pi,1);
  }
  else if(action==='add-orderitem'){ const maxRank = Math.max(0,...r.items.map(i=>i.rank)); r.items.push({id: uid('s'), content:'새 항목', rank:maxRank+1}); }
  else if(action==='rm-orderitem'){
    if(r.items.length<=2) return;
    const items = [...r.items].sort((a,b)=>a.rank-b.rank);
    const removeId = items[+btn.dataset.ii].id;
    r.items = r.items.filter(it=>it.id!==removeId);
    r.items.sort((a,b)=>a.rank-b.rank).forEach((it,i)=>{ it.rank = i+1; });
  }
  else if(action==='order-up' || action==='order-down'){
    const items = [...r.items].sort((a,b)=>a.rank-b.rank);
    const i = +btn.dataset.ii; const j = action==='order-up' ? i-1 : i+1;
    if(j<0 || j>=items.length) return;
    const tmp = items[i].rank; items[i].rank = items[j].rank; items[j].rank = tmp;
  }
  else if(action==='add-option'){ r.options.push('새 보기'); }
  else if(action==='rm-option'){
    if(r.options.length<=2) return;
    const oi = +btn.dataset.oi;
    r.options.splice(oi,1);
    if(r._correctIdx===oi) r._correctIdx = 0;
    else if(r._correctIdx>oi) r._correctIdx--;
  }
  else if(action==='set-correct'){ r._correctIdx = +btn.dataset.oi; }
  else if(action==='add-statement'){ if(r.statements.length<TAGS.length) r.statements.push('새 문장'); }
  else if(action==='rm-statement'){
    if(r.statements.length<=1) return;
    const si = +btn.dataset.si;
    r.statements.splice(si,1);
    r.comboOptions.forEach(combo=>{
      const idx2 = combo.indexOf(si);
      if(idx2>=0) combo.splice(idx2,1);
      for(let k=0;k<combo.length;k++) if(combo[k]>si) combo[k]--;
    });
  }
  else if(action==='add-combo'){ r.comboOptions.push([]); }
  else if(action==='rm-combo'){
    if(r.comboOptions.length<=2) return;
    const ci = +btn.dataset.ci;
    r.comboOptions.splice(ci,1);
    if(r.correctComboIndex===ci) r.correctComboIndex = 0;
    else if(r.correctComboIndex>ci) r.correctComboIndex--;
  }
  else if(action==='set-combocorrect'){ r.correctComboIndex = +btn.dataset.ci; }
  else if(action==='toggle-combo-idx'){
    const ci = +btn.dataset.ci, si = +btn.dataset.si;
    const combo = r.comboOptions[ci];
    const pos = combo.indexOf(si);
    if(btn.checked && pos<0) combo.push(si), combo.sort((a,b)=>a-b);
    if(!btn.checked && pos>=0) combo.splice(pos,1);
  }
  else return;

  rerenderRound(scope, rIdx);
  setStatus('수정됨 (저장 필요)', 'info');
}

/* ---------- 저장 ---------- */
async function saveCurrent(){
  if(!curFile) return;

  document.querySelectorAll('.metafield').forEach(el=>{
    const f = el.dataset.mfield;
    if(f==='title') curMeta.title = el.value.trim();
    else if(f==='targetMin') curMeta.targetMin = +el.value||0;
    else if(f==='passCount') curMeta.passCount = +el.value||0;
    else if(f==='scoreNotice') curMeta.scoreNotice = el.value;
  });

  let vars;
  try{ vars = JSON.parse(document.getElementById('varsbox').value); }
  catch(e){ setStatus('고급 설정(vars) JSON 오류: '+e.message, 'err'); return; }

  const rounds = workingRounds.map(denormalizeRound);
  if(workingPool.length){
    curExtra.gradablePool = workingPool.map(denormalizeRound);
    curExtra.gradablePoolCount = curGradablePoolCount;
  }
  const merged = { seedKey: curSeedKey, vars, meta: curMeta, rounds, ...curExtra };

  setStatus('저장 중...', 'info');
  try{
    const res = await fetch('/api/data/'+curFile, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(merged) });
    const out = await res.json();
    if(out.ok){
      setStatus('저장 완료 ✅ 학생이 이 단원을 새로고침하면 바로 반영됩니다', 'ok');
      loadChapterList();
    } else {
      setStatus('저장 실패: '+(out.error||'알 수 없는 오류'), 'err');
    }
  }catch(e){
    setStatus('저장 실패(서버 연결 오류): '+e.message, 'err');
  }
}

document.getElementById('saveBtn').addEventListener('click', saveCurrent);
document.getElementById('reloadBtn').addEventListener('click', ()=>{ if(curFile) selectChapter(curFile); });
document.getElementById('item-students').addEventListener('click', selectStudents);
document.getElementById('item-depts').addEventListener('click', selectDepts);
document.getElementById('item-board').addEventListener('click', selectBoard);

loadChapterList().then(()=>{
  // ?ch=ch10 또는 ?ch=ch10.json 으로 들어오면 그 단원을 바로 열어서 보여준다
  // (로비 화면의 "내용 확인" 링크가 이 파라미터로 연결됨)
  const want = new URLSearchParams(location.search).get('ch');
  if(want){
    const file = want.endsWith('.json') ? want : want + '.json';
    if(CHAPTERS.some(c=>c.file===file)) selectChapter(file);
  }
});
