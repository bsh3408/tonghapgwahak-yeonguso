   <h1>통합과학 수행평가 긴급공지</h1>
   <div class="sub">숲속의 연금술사 클리어 코드를 입력한 학생은 반드시 읽으세요</div>
  </div>

  <div class="lead">
   <div class="when">📅 10월 19일(월) ~ 20일(화)</div>
   <div class="big">중화 반응 문제로 <b>오프라인 테스트</b>를 봅니다.<br>
    코드를 입력하고 테스트를 <b>통과하지 못하면</b><br><b>부정행위로 간주 · 수행평가 3점 감점</b></div>
  </div>

  <ol class="points">
   <li><span class="num">1</span><div class="pt"><strong>코드를 입력한 학생은 모두 응시합니다.</strong><br>
    게임 성소에서 푼 것과 같은 유형의 <b>중화 반응 문제</b>를 교실에서 직접 풉니다.</div></li>
   <li><span class="num">2</span><div class="pt"><strong>혼자 힘으로 풀지 않았다면 지금 취소하세요.</strong><br>
    AI나 친구의 도움으로 코드를 받았다면 <span class="hl">10월 8일(목)까지</span> 스스로 코드 입력을 취소할 수 있어요.
    취소하면 <span class="ok">감점 없이</span> +1점만 빠집니다.</div></li>
   <li><span class="num">3</span><div class="pt"><strong>다시 혼자 풀 수 있게 되면 다시 입력해도 됩니다.</strong><br>
    성소의 <b>📖 다시 풀어 보기</b>로 연습한 뒤, 같은 코드를 다시 넣으면 +1점이 돌아옵니다.</div></li>
   <li><span class="num">4</span><div class="pt"><strong>마감: <span class="hl">10월 8일(목)</span></strong><br>
    연구소의 코드 <b>입력과 취소는 모두 10월 8일에 마감</b>됩니다. 그 뒤에는 바꿀 수 없어요.</div></li>
  </ol>
