<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 계정 관리 (교사용)</title>
<style>
  :root{ --bg:#f4f5f7; --card:#ffffff; --line:#e2e4e9; --text:#1f2430; --sub:#6b7280;
    --accent:#3fae95; --danger:#c1544c; --gold:#c99622; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','맑은 고딕',sans-serif;background:var(--bg);color:var(--text);padding:24px;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--sub);font-size:13.5px;margin-bottom:18px;line-height:1.6;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
  .box h2{font-size:15px;margin:0 0 10px;}
  textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:8px;padding:12px;
    font-family:'D2Coding','Consolas',monospace;font-size:13.5px;line-height:1.6;resize:vertical;}
  .hint{font-size:12.5px;color:var(--sub);margin:8px 0 12px;line-height:1.7;background:#fbf7ec;
    border:1px solid #eee0bd;border-radius:8px;padding:10px 14px;}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600;
    background:var(--accent);color:#fff;}
  .btn:hover{filter:brightness(1.05);}
  .btn-danger{background:#fdeeee;color:var(--danger);}
  .status{font-size:13px;padding:8px 12px;border-radius:8px;margin-top:10px;display:none;}
  .status.show{display:block;}
  .status.ok{background:#eafaf3;color:var(--accent);}
  .status.err{background:#fdeeee;color:var(--danger);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
  th{background:#f7f8fa;color:var(--sub);font-weight:700;font-size:12px;}
  .badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;}
  .badge.done{background:#eafaf3;color:var(--accent);}
  .badge.wait{background:#fbf7ec;color:var(--gold);}
  .badge.never{background:#f1ece2;color:var(--sub);}
  .toolbar{display:flex;gap:10px;align-items:center;margin-top:10px;}
  .count{font-size:13px;color:var(--sub);margin-left:auto;}
</style>
</head>
<body>
<div class="wrap">
  <h1>👤 학생 계정 관리</h1>
  <div class="sub">통합과학연구소 로비(05_프로토타입.html) 로그인에 쓸 학생 명단입니다. 아이디는 이름, 처음 비밀번호는 학번이고,
    학생은 첫 로그인 후 비밀번호를 새로 정해야 합니다.</div>

  <div class="box">
    <h2>명단 등록/추가</h2>
    <div class="hint">
      한 줄에 <b>이름,학번</b> 형식으로 붙여넣으세요 (쉼표 또는 탭으로 구분). 예)<br>
      <code>김철수,10315<br>이영희,10316</code><br>
      이미 등록된 이름은 건드리지 않습니다(비밀번호를 이미 바꾼 학생은 그대로 유지) — 새 학생 추가나 명단 갱신용으로 언제든 다시 붙여넣어도 안전합니다.
    </div>
    <textarea id="rosterInput" placeholder="김철수,10315&#10;이영희,10316"></textarea>
    <div class="toolbar">
      <button class="btn" id="submitBtn">명단 등록</button>
      <button class="btn btn-danger" id="resetBtn">전체 초기화</button>
    </div>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="box">
    <h2>현재 등록 현황</h2>
    <div class="toolbar" style="margin-top:0;margin-bottom:10px">
      <button class="btn" id="refreshBtn" style="background:#eceef1;color:var(--text)">↻ 새로고침</button>
      <span class="count" id="countLabel"></span>
    </div>
    <div id="tablewrap"></div>
  </div>
</div>
<script>
function parseRoster(text){
  return text.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const parts = line.split(/[,\t]/).map(s=>s.trim());
    return { name: parts[0]||'', studentId: parts[1]||'' };
  }).filter(s=>s.name && /^\d+$/.test(s.studentId));
}

function setStatus(msg, cls){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status show ' + (cls||'');
}

async function submitRoster(){
  const raw = document.getElementById('rosterInput').value;
  const rawLineCount = raw.split('\n').map(l=>l.trim()).filter(Boolean).length;
  const students = parseRoster(raw);
  if(!students.length){ setStatus('등록할 학생이 없습니다. "이름,학번" 형식으로(학번은 숫자만) 입력하세요.', 'err'); return; }
  if(students.length < rawLineCount){
    if(!confirm(`${rawLineCount - students.length}줄이 "이름,학번"(학번은 숫자만) 형식이 아니라 무시됩니다. 계속할까요?`)) return;
  }
  setStatus('등록 중...', '');
  try{
    const res = await fetch('/api/roster', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({students}) });
    const out = await res.json();
    if(out.ok){
      setStatus(`등록 완료 — 새로 추가 ${out.added}명, 이미 있어서 건너뜀 ${out.skipped}명 (전체 ${out.total}명)`, 'ok');
      document.getElementById('rosterInput').value='';
      loadRoster();
    } else setStatus('등록 실패: '+(out.error||'알 수 없는 오류'), 'err');
  }catch(e){ setStatus('등록 실패(서버 연결 오류): '+e.message, 'err'); }
}

async function resetRoster(){
  if(!confirm('전체 학생 계정을 삭제할까요? 모든 학생이 다시 처음부터(학번=비밀번호) 로그인해야 합니다.')) return;
  await fetch('/api/roster', {method:'DELETE'});
  setStatus('전체 초기화되었습니다.', 'ok');
  loadRoster();
}

async function loadRoster(){
  const wrap = document.getElementById('tablewrap');
  wrap.innerHTML = '<div style="color:var(--sub);font-size:13px">불러오는 중...</div>';
  try{
    const res = await fetch('/api/roster', {cache:'no-store'});
    const list = await res.json();
    document.getElementById('countLabel').textContent = `총 ${list.length}명`;
    if(!list.length){ wrap.innerHTML = '<div style="color:var(--sub);font-size:13px">등록된 학생이 없습니다.</div>'; return; }
    wrap.innerHTML = `<table>
      <thead><tr><th>이름</th><th>학번(초기 비밀번호)</th><th>상태</th></tr></thead>
      <tbody>${list.map(s=>`<tr>
        <td>${esc(s.name)}</td><td>${esc(s.studentId)}</td>
        <td>${s.mustChange
          ? (s.loggedIn ? '<span class="badge wait">로그인함·비밀번호 변경 대기</span>' : '<span class="badge never">아직 로그인 안 함</span>')
          : '<span class="badge done">비밀번호 변경 완료</span>'}</td>
      </tr>`).join('')}</tbody></table>`;
  }catch(e){ wrap.innerHTML = '<div style="color:var(--danger);font-size:13px">불러오기 실패: '+e.message+'</div>'; }
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('submitBtn').addEventListener('click', submitRoster);
document.getElementById('resetBtn').addEventListener('click', resetRoster);
document.getElementById('refreshBtn').addEventListener('click', loadRoster);
loadRoster();
</script>
</body>
</html>
